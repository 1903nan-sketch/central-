/* ================= MARCA = NOME DA CLÍNICA (muda sozinha quando a clínica muda o nome) ================= */
const BRAND_KEY='lumiere.brand';
const brandStored=()=>{try{return localStorage.getItem(BRAND_KEY)||''}catch(e){return''}};
function brandName(){return ((db&&db.settings&&db.settings.clinic)||'').trim()||brandStored()||'Minha clínica'}
const brandKnown=()=>brandName()!=='Minha clínica';
function brandInitial(){const stop=['clinica','dra','dr','studio','estudio','espaco','instituto','centro','de','da','do','das','dos','e','minha','a','o'];
  const w=brandName().split(/\s+/).filter(x=>x&&!stop.includes(norm(x).replace(/\./g,'')));return((w[0]||brandName()).charAt(0)||'C').toUpperCase()}
const _iconCache={};
function brandIcon(size){const k=brandInitial()+size+(document.fonts&&document.fonts.status);if(_iconCache[k])return _iconCache[k];
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const g=x.createRadialGradient(size*.3,size*.15,0,size*.5,size*.5,size*.85);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#f2f2f7');g.addColorStop(1,'#d9dbe1');x.fillStyle=g;x.fillRect(0,0,size,size);
  x.strokeStyle='rgba(40,44,52,.07)';x.lineWidth=Math.max(1,size/256);for(let r=size*.07;r<size*.5;r+=size*.072){x.beginPath();x.arc(size/2,size/2,r,0,Math.PI*2);x.stroke()}
  x.fillStyle='#1d1d1f';x.font=`600 ${Math.round(size*.48)}px -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(brandInitial(),size/2,size*.535);
  return _iconCache[k]=c.toDataURL('image/png')}
let _brandApplied='';
function applyBrand(){const name=brandName();if(brandKnown()){try{localStorage.setItem(BRAND_KEY,name)}catch(e){}}
  const key=name+'|'+(document.fonts&&document.fonts.status);if(_brandApplied===key)return;_brandApplied=key;
  document.title=name;
  const set=(sel,attr,val,mk)=>{let el=document.querySelector(sel);if(!el&&mk){el=document.createElement(mk.tag);Object.assign(el,mk.props);document.head.appendChild(el)}if(el)el.setAttribute(attr,val)};
  set('meta[name="apple-mobile-web-app-title"]','content',name);
  set('link[rel="apple-touch-icon"]','href',brandIcon(180),{tag:'link',props:{rel:'apple-touch-icon'}});
  set('link[rel="icon"]','href',brandIcon(64));
  try{const base=location.href.split('#')[0].split('?')[0],dir=base.slice(0,base.lastIndexOf('/')+1);
    const short=name.length<=12?name:name.split(/\s+/).filter(Boolean).slice(0,2).join(' ').slice(0,12);
    const man={name,short_name:short,start_url:base,scope:dir,display:'standalone',orientation:'portrait',background_color:'#f2f2f7',theme_color:'#f2f2f7',
      icons:[{src:brandIcon(192),sizes:'192x192',type:'image/png',purpose:'any'},{src:brandIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const old=document.querySelector('link[rel="manifest"]');if(old&&old.href.startsWith('blob:'))URL.revokeObjectURL(old.href);
    if(location.protocol.startsWith('http'))set('link[rel="manifest"]','href',URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})))}catch(e){}
}
if(document.fonts)document.fonts.ready.then(()=>{_brandApplied='';applyBrand()});

/* ================= JANELA DO DIA (setas + arrastar no celular) ================= */
function syncCalendar(d){S.selDay=d;if(mKey(d)!==S.calMonth)S.calMonth=mKey(d);if(S.view==='agenda'&&$('#calCard')){$('#calCard').innerHTML=calHTML();$('#dayPanel').innerHTML=dayHTML()}}
function openDaySheet(day){
  let cur=day,dir=0;
  openModal({title:'<span class="ds-title"></span>',size:'sm',body:'<div data-ds></div>',
    foot:`<button class="btn dark" data-new style="flex:1">${ic('plus')}Agendar neste dia</button>`,
    onMount:(el,m)=>{
      const head=$('.m-head',el),nav=document.createElement('div');nav.className='ds-nav';
      nav.innerHTML=`<button class="btn icon" data-pv aria-label="Dia anterior">${ic('chevL')}</button><button class="btn icon" data-nx aria-label="Próximo dia">${ic('chevR')}</button>`;
      head.insertBefore(nav,$('[data-x]',head));
      const draw=()=>{const d=parse(cur);
        $('.ds-title',el).innerHTML=`<b>${d.getDate()}</b><span>${cap(d.toLocaleDateString('pt-BR',{weekday:'long'}))}<small>${MONTHS[d.getMonth()]} de ${d.getFullYear()} · ${cur===today()?'hoje':relDays(cur)}</small></span>`;
        const A=db.appointments.filter(a=>a.date===cur).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),Rt=activeReturns().filter(r=>r.date===cur);
        $('[data-ds]',el).innerHTML=`<div class="ds-body" style="--dir:${dir*28}px">
          <div class="ds-sec">Consultas</div>${A.length?`<div class="list">${A.map(a=>apptItem(a)).join('')}</div>`:`<div class="ds-empty">Nenhuma consulta neste dia.</div>`}
          ${Rt.length?`<div class="ds-sec">Retornos previstos</div><div class="list">${Rt.map(r=>`<button class="item" data-act="folder" data-id="${r.patientId}">${av(P(r.patientId).name)}<div class="grow"><div class="t">${esc(P(r.patientId).name)}</div><div class="s">${esc(r.note||'Retorno')}</div></div>${badge(RST,r.status)}</button>`).join('')}</div>`:''}
          <div class="ds-hint">Arraste para o lado para mudar o dia</div></div>`;
        syncCalendar(cur)};
      const step=n=>{dir=n;cur=addDays(cur,n);draw()};
      $('[data-pv]',el).onclick=()=>step(-1);$('[data-nx]',el).onclick=()=>step(1);
      $('[data-new]',el).onclick=()=>openAppt({date:cur});
      el.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&el.contains(a)){e.stopPropagation();ACT[a.dataset.act](a.dataset.id,a,e)}});
      // arrastar o dedo
      const body=$('.m-body',el);let x0=null,y0=0;
      body.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
      body.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)step(dx<0?1:-1)},{passive:true});
      // setas do teclado
      const key=e=>{if(!document.body.contains(el)){document.removeEventListener('keydown',key);return}if(layers[layers.length-1]!==m)return;if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)};
      document.addEventListener('keydown',key);
      m.refresh=draw;draw();
    }});
}

/* ================= BUSCA GERAL (estilo Spotlight do iPhone) ================= */
function spotResults(q){
  const n=norm(q),dq=digits(q),has=t=>norm(t).includes(n);
  const A=[
    ['Nova consulta','plus','Agendar um atendimento',()=>openAppt({date:today()})],
    ['Novo paciente','user','Cadastrar só com o nome',()=>openPatient()],
    ['Novo orçamento','doc','Montar valores e enviar',()=>openBudget()],
    ['Novo retorno','ret','Lembrar alguém de voltar',()=>openReturn({})],
    ['Agenda','cal','Calendário e dia de hoje',()=>go('agenda')],
    ['Pacientes','users','Todas as pastas',()=>go('pacientes')],
    ['Orçamentos','doc','Abertos, aprovados e recusados',()=>go('orcamentos')],
    ['Retornos','ret','Avisar quem precisa voltar',()=>go('retornos')],
    ['Procedimentos','tag','Serviços e valores',()=>go('procedimentos')],
    ['Ajustes','gear','Perfil, aparência e conta',()=>go('ajustes')],
    [document.documentElement.dataset.theme==='dark'?'Modo claro':'Modo escuro',document.documentElement.dataset.theme==='dark'?'sun':'moon','Trocar a aparência',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')]
  ].map(([t,i,s2,fn])=>({t,i,s:s2,fn}));
  const groups=[];
  if(!n){
    groups.push({g:'Sugestões',items:A.slice(0,4)});
    const rec=[...db.patients].map(p=>({p,l:patientStats(p.id).last||''})).sort((a,b)=>b.l.localeCompare(a.l)||(b.p.createdAt||0)-(a.p.createdAt||0)).slice(0,5);
    if(rec.length)groups.push({g:'Pacientes recentes',items:rec.map(({p,l})=>({av:p.name,t:p.name,s:[p.phone,l?`última visita ${fmtD(l)}`:''].filter(Boolean).join(' · ')||'sem consultas',fn:()=>openFolder(p.id)}))});
    return groups;
  }
  const pats=db.patients.filter(p=>has(p.name)||(dq.length>=3&&(digits(p.phone).includes(dq)||digits(p.cpf).includes(dq)))).slice(0,6);
  if(pats.length)groups.push({g:'Pacientes',items:pats.map(p=>{const st=patientStats(p.id);return{av:p.name,t:p.name,s:[p.phone,st.nextR?`retorno ${fmtD(st.nextR.date)}`:'',st.done.length?`${st.done.length} atendimento${st.done.length>1?'s':''}`:''].filter(Boolean).join(' · ')||'Ficha básica',fn:()=>openFolder(p.id)}})});
  const ap=db.appointments.filter(a=>{const pt=P(a.patientId);return pt&&(has(pt.name)||has(procNames(a.items))||fmtD(a.date).includes(q.trim())||fmtDM(a.date)===q.trim())}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);

const BUCKET='lumiere-files',ATT_TYPES=['Documento','Termo assinado','Foto antes','Foto depois','Exame','Outro'];
const useCloudFiles=()=>!!(session&&session.access_token&&!window.LUMIERE_DEMO);
async function storageUpload(path,blob,type){const t=await accessToken();let r;try{r=await fetch(`${SB.url}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':type,'x-upsert':'true'},body:blob})}catch(e){throw new Error('sem conexão')}if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(j.message||('erro '+r.status))}}
async function storageGet(path){const t=await accessToken();const r=await fetch(`${SB.url}/storage/v1/object/authenticated/${BUCKET}/${path}`,{headers:{apikey:SB.key,Authorization:'Bearer '+t}});if(!r.ok)throw new Error('não foi possível abrir');return r.blob()}
function storageDel(paths){if(!paths.length||!useCloudFiles())return;accessToken().then(t=>fetch(`${SB.url}/storage/v1/object/${BUCKET}`,{method:'DELETE',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths})})).catch(()=>{})}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function prepFile(f){
  if(/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)||(/^image\//.test(f.type)&&!/gif|svg/.test(f.type))){
    const url=URL.createObjectURL(f);try{const im=await loadImg(url);const sc=(m)=>Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas'),k=sc(1800);c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await toBlob(c,'image/jpeg',.86);
      const t=document.createElement('canvas'),k2=sc(260);t.width=Math.round(im.width*k2);t.height=Math.round(im.height*k2);t.getContext('2d').drawImage(im,0,0,t.width,t.height);
      return{blob,type:'image/jpeg',thumb:t.toDataURL('image/jpeg',.72),ext:'jpg'}}finally{URL.revokeObjectURL(url)}}
  if(f.size>15*1024*1024)throw new Error(`${f.name} passa de 15 MB`);
  return{blob:f,type:f.type||'application/octet-stream',ext:(f.name.split('.').pop()||'bin').toLowerCase().slice(0,5)};
}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function addFiles(files,pid,label){const out=[];for(const f of files){const x=await prepFile(f);const a={id:uid(),name:f.name.replace(/\.[^.]+$/,'')||'Arquivo',label,type:x.type,size:x.blob.size,date:today(),thumb:x.thumb||''};
    if(useCloudFiles()){a.path=`${session.user.id}/${pid}/${a.id}.${x.ext}`;await storageUpload(a.path,x.blob,x.type)}
    else{if(x.blob.size>2.5*1024*1024)throw new Error('Na demonstração o limite é 2,5 MB por arquivo');a.data=await blobToData(x.blob)}
    out.push(a)}return out}
async function attBlobUrl(a){if(a.data)return a.data;return URL.createObjectURL(await storageGet(a.path))}

function campaignTargets(f){const R=realized(),t=today(),out={list:[],noPhone:0,optOut:0};

    if(f.bday){if(!p.birth)continue;const m=+p.birth.slice(5,7),tm=+t.slice(5,7);if(f.bday==='este'&&m!==tm)continue;if(f.bday==='proximo'&&m!==tm%12+1)continue}

      <div class="row wrap" style="gap:8px"><span class="small muted">Data do procedimento</span>${dbtn('pFrom','De')}${dbtn('pTo','Até')}</div></div>
    <div class="fsec">${ic('clock')}Última consulta e aniversário</div>
    <div class="box stack">${seg('lastMode',[['','Qualquer'],['mais','Sem vir há mais de…'],['periodo','Entre datas']])}
      <div class="row wrap" data-lastm style="gap:8px"><input class="in" data-fn="lastMonths" type="number" min="1" max="60" style="width:90px"><span class="small muted">meses</span></div>
      <div class="row wrap" data-lastp style="gap:8px">${dbtn('lastFrom','De')}${dbtn('lastTo','Até')}</div>
      <div class="row wrap" style="gap:8px"><span class="small muted">Aniversário</span>${seg('bday',[['','Qualquer'],['este','Este mês'],['proximo','Próximo mês']])}</div></div>
    <div class="fsec">${ic('users')}Cadastro</div>
    <div class="box stack"><div class="grid3"><label class="field"><span>Bairro</span><input class="in" data-fn="bairro" placeholder="Ex.: Jardins"></label><label class="field"><span>Cidade</span><input class="in" data-fn="cidade" placeholder="Ex.: São Paulo"></label><label class="field"><span>CEP começa com</span><input class="in" data-fn="cep" inputmode="numeric" placeholder="Ex.: 014"></label></div>
      <div class="grid3"><label class="field"><span>Idade mínima</span><input class="in" data-fn="ageMin" type="number" min="0"></label><label class="field"><span>Idade máxima</span><input class="in" data-fn="ageMax" type="number" min="0"></label><div class="field"><span>Sexo</span>${seg('gender',[['','Todos'],['F','Fem.'],['M','Masc.'],['O','Outro']])}</div></div>
      <div class="field"><span>Como conheceu</span><div class="chips" data-fsrc></div></div>
      <div class="field"><span>Tipo de pele</span><div class="chips" data-fskin></div></div>
      <label class="sw-row" style="padding:4px 0"><span><b>Só quem tem orçamento em aberto</b></span><span class="switch"><input type="checkbox" data-fob><i></i></span></label></div>
    <div class="fsec">${ic('wa')}Mensagem</div>
    <div class="box stack"><textarea class="in" data-ct style="min-height:130px">${esc(tpl)}</textarea>
      <div class="chips">${['nome','procedimento','data'].map(v=>`<button type="button" class="chip" data-var="${v}">{${v}}</button>`).join('')}</div>
      <div class="small muted">O rodapé “Se não quiser mais receber mensagens, é só avisar.” entra automaticamente em todas as mensagens.</div></div>
    <div class="fsec">${ic('eye')}Pré-visualização</div>
    <div class="box"><div data-prev></div>
      <div data-pvwrap style="display:none"><div class="row wrap pv-tools"><label class="pv-q">${ic('search')}<input class="in" data-pvq placeholder="Buscar paciente pelo nome ou telefone" autocomplete="off"></label><button type="button" class="btn sm" data-pvall="1">Marcar todas</button><button type="button" class="btn sm" data-pvall="0">Desmarcar todas</button></div><div data-pvl></div></div></div>
  </div>`,
  foot:`<button class="btn" data-cancel>Cancelar</button><button class="btn" data-draft>Salvar rascunho</button><button class="btn dark" data-send>${ic('send')}Enviar</button>`,
  onMount:(el,m)=>{
    const prevBox=$('[data-prev]',el),pvWrap=$('[data-pvwrap]',el),pvList=$('[data-pvl]',el);let T={list:[]},timer,q='';
    const pvMatch=x=>{if(!q)return true;const dq=q.replace(/\D/g,'');return norm(x.p.name).includes(q)||(dq.length>=3&&String(x.p.phone||'').replace(/\D/g,'').includes(dq))};
    const filterList=()=>{let n=0;$$('.pv-it',pvList).forEach(it=>{const x=T.list.find(t=>t.p.id===$('[data-pv]',it).dataset.pv);const ok=!!x&&pvMatch(x);it.style.display=ok?'':'none';if(ok)n++});
      const e=$('[data-pvnone]',pvList);if(e)e.outerHTML='';if(!n&&T.list.length)pvList.insertAdjacentHTML('beforeend','<div class="small muted" data-pvnone style="padding:12px 4px">Ninguém com esse nome na lista.</div>')};
    const sync=()=>{
      $$('[data-f]',el).forEach(g=>$$('button',g).forEach(b=>b.classList.toggle('on',b.dataset.v===String(f[g.dataset.f]))));
      const pr=f.proc&&procById(f.proc);$('[data-fproc]',el).innerHTML=`${ic('tag')}<span>${pr?esc(pr.name):'Qualquer procedimento'}</span><span class="dd">▾</span>`;$('[data-fproc]',el).classList.toggle('on',!!pr);
      $$('[data-fd]',el).forEach(b=>{const k=b.dataset.fd;b.classList.toggle('on',!!f[k]);$('span',b).textContent=(/From$/.test(k)?'De ':'Até ')+(f[k]?fmtD(f[k]):'…')});
      $('[data-lastm]',el).style.display=f.lastMode==='mais'?'':'none';$('[data-lastp]',el).style.display=f.lastMode==='periodo'?'':'none';
      $('[data-fob]',el).checked=!!f.openBudget;
      const chipsOf=(box,list,key)=>{box.innerHTML=[['','Todos'],...list.map(x=>[x,x])].map(([v,l])=>`<button type="button" class="chip ${f[key]===v?'on':''}" data-v="${esc(v)}">${esc(l)}</button>`).join('')};
      chipsOf($('[data-fsrc]',el),db.settings.sources||[],'source');chipsOf($('[data-fskin]',el),SKINS,'skin');
      clearTimeout(timer);timer=setTimeout(preview,80)};
    const preview=()=>{T=campaignTargets(f);tpl=$('[data-ct]',el).value;const sel=T.list.filter(x=>!excluded.has(x.p.id));const ex=sel[0]||T.list[0];
      prevBox.innerHTML=`<div class="row between wrap" style="gap:8px;margin-bottom:10px"><b class="pv-n">${sel.length} paciente${sel.length===1?'':'s'} vão receber</b><span class="small muted">${[T.optOut?`${T.optOut} fora das campanhas`:'',T.noPhone?`${T.noPhone} sem WhatsApp`:'',excluded.size?`${[...excluded].filter(id=>T.list.some(x=>x.p.id===id)).length} desmarcada(s)`:''].filter(Boolean).join(' · ')}</span></div>
        ${ex?`<div class="small muted" style="margin-bottom:6px">Exemplo para ${esc(ex.p.name)}:</div><div class="msg-prev">${esc(campMsg(tpl,ex))}</div>`:'<div class="small muted">Nenhuma paciente com esses filtros.</div>'}
`;
      pvWrap.style.display=T.list.length?'':'none';
      pvList.innerHTML=T.list.length?`<div class="pv-list scroll">${T.list.map(x=>`<label class="pv-it"><input type="checkbox" class="ck" data-pv="${x.p.id}" ${excluded.has(x.p.id)?'':'checked'}><span class="grow"><b>${esc(x.p.name)}</b><small>${esc(x.p.phone)}${x.match?` · ${esc(x.match.name)} em ${fmtD(x.match.date)}`:''}</small></span></label>`).join('')}</div>`:'';filterList();
      $('[data-send]',el).innerHTML=`${ic('send')}Enviar para ${sel.length}`;$('[data-send]',el).disabled=!sel.length};
    sync();$('[data-fn="lastMonths"]',el).value=f.lastMonths;['bairro','cidade','cep','ageMin','ageMax'].forEach(k=>$(`[data-fn="${k}"]`,el).value=f[k]||'');
    el.addEventListener('click',async e=>{
      const sg=e.target.closest('[data-f] [data-v]');if(sg){const k=sg.closest('[data-f]').dataset.f;f[k]=sg.dataset.v;if(k==='cat'&&f.proc&&procById(f.proc)?.cat!==f.cat&&f.cat)f.proc='';sync();return}
      const ch=e.target.closest('[data-fsrc] [data-v],[data-fskin] [data-v]');if(ch){f[ch.closest('[data-fsrc]')?'source':'skin']=ch.dataset.v;sync();return}
      const fd=e.target.closest('[data-fd]');if(fd){const v=await pickDate(fd,f[fd.dataset.fd]||today(),[['Limpar','']]);if(v!==null){f[fd.dataset.fd]=v;sync()}return}
      const fp=e.target.closest('[data-fproc]');if(fp){const L=db.procedures.filter(x=>!f.cat||x.cat===f.cat).sort((a,b)=>a.name.localeCompare(b.name));openMenu(fp,[{label:'Qualquer procedimento',icon:'tag',fn:()=>{f.proc='';sync()}},...L.map(x=>({label:esc(x.name),icon:x.cat==='cirurgia'?'scalpel':'tag',fn:()=>{f.proc=x.id;sync()}}))]);return}
      const pa=e.target.closest('[data-pvall]');if(pa){T.list.filter(pvMatch).forEach(x=>pa.dataset.pvall==='1'?excluded.delete(x.p.id):excluded.add(x.p.id));preview();return}
      const vr=e.target.closest('[data-var]');if(vr){const t=$('[data-ct]',el),a=t.selectionStart,b=t.selectionEnd,v=`{${vr.dataset.var}}`;t.value=t.value.slice(0,a)+v+t.value.slice(b);t.focus();t.selectionStart=t.selectionEnd=a+v.length;preview();return}
    });
    el.addEventListener('change',e=>{const pv=e.target.closest('[data-pv]');if(pv){pv.checked?excluded.delete(pv.dataset.pv):excluded.add(pv.dataset.pv);preview()}if(e.target.matches('[data-fob]')){f.openBudget=e.target.checked;sync()}});
    el.addEventListener('input',e=>{if(e.target.matches('[data-pvq]')){q=norm(e.target.value.trim());filterList();return}const k=e.target.dataset.fn;if(k){f[k]=e.target.value.trim();sync()}if(e.target.matches('[data-ct]'))preview()});
    $('[data-cancel]',el).onclick=m.close;
    const save=async send=>{name=$('[data-cn]',el).value.trim();tpl=$('[data-ct]',el).value.trim();
      if(!name){toast('Dê um nome para a campanha');$('[data-cn]',el).focus();return}if(!tpl){toast('Escreva a mensagem');return}
      const sel=T.list.filter(x=>!excluded.has(x.p.id));
      if(send){if(!sel.length){toast('Nenhuma paciente para enviar');return}
        if(!await confirmBox(evoOn()?`Enviar para <b>${sel.length}</b> paciente${sel.length===1?'':'s'}? A fila envia cerca de 4 mensagens por minuto, com intervalos variados, das 8h às 20h.`:`Preparar o envio para <b>${sel.length}</b> paciente${sel.length===1?'':'s'}? O WhatsApp vai abrir com a mensagem pronta, uma paciente por vez.`,'Enviar'))return}
      const filters={...f,excluded:[...excluded]};
      try{let c=editingDraft;
        if(c){await crmUpdate('campaigns',c.id,{name,filters,template:tpl,status:send?'enviando':'rascunho',updated_at:new Date().toISOString()})}
        else{[c]=await crmInsert('campaigns',{name,filters,template:tpl,status:send?'enviando':'rascunho'})}
        if(send){await crmInsert('sends',sel.map(x=>({campaign_id:c.id,patient_id:x.p.id,patient_name:x.p.name,phone:waNum(x.p.phone),message:campMsg(tpl,x),status:'na_fila'})))}
        m.close();changed();toast(send?'Campanha criada':'Rascunho salvo');openCampaign(c.id);if(send&&!evoOn())setTimeout(()=>manualQueue(c.id),350)}
      catch(e){toast('Não foi possível salvar: '+e.message)}};
    $('[data-draft]',el).onclick=()=>save(false);$('[data-send]',el).onclick=()=>save(true);
  }});
}

function openCampaign(id){let tab='envios';
  openModal({title:'Campanha',size:'lg',body:'<div data-cp></div>',onMount:(el,m)=>{
    const draw=()=>{const c=CRM.campaigns.find(x=>x.id===id);if(!c){m.close();return}const st=campStats(id);
      const S2=CRM.sends.filter(x=>x.campaign_id===id).sort((a,b)=>String(b.sent_at||b.created_at).localeCompare(String(a.sent_at||a.created_at)));
      const RP=CRM.replies.filter(x=>x.campaign_id===id).sort((a,b)=>String(b.received_at).localeCompare(String(a.received_at)));
      const repBy=new Set(RP.map(r=>r.send_id));
      $('[data-cp]',el).innerHTML=`<div class="row between wrap" style="gap:10px"><div><h2 class="cp-t">${esc(c.name)}</h2><div class="small muted">${esc(filtersSummary(c.filters||{}).join(' · '))}</div></div>${badge(CST,c.status)}</div>
        <div class="f-stats" style="grid-template-columns:repeat(5,1fr)"><div><small>Público</small><b>${st.total}</b></div><div><small>Enviadas</small><b>${st.sent}</b></div><div><small>Na fila</small><b>${st.queue}</b></div><div><small>Responderam</small><b>${st.responded}</b></div><div><small>Taxa de resposta</small><b>${st.rate}%</b></div></div>
        ${st.total?`<div class="progress"><i style="width:${Math.round(st.sent/st.total*100)}%"></i></div>`:''}
        <div class="row wrap" style="gap:8px;margin:12px 0 16px">
          ${c.status==='rascunho'?`<button class="btn dark sm" data-edit>${ic('edit')}Editar e enviar</button>`:''}
          ${st.queue&&!evoOn()?`<button class="btn wa sm" data-manual>${ic('wa')}Enviar pelo WhatsApp (${st.queue})</button>`:''}
          ${c.status==='enviando'&&evoOn()?`<button class="btn sm" data-pause>Pausar</button>`:''}${c.status==='pausada'?`<button class="btn sm" data-resume>Retomar</button>`:''}
          ${st.queue?`<button class="btn sm ghost danger" data-cancelq>Cancelar fila</button>`:''}
          <button class="btn sm" data-dup>${ic('copy')}Duplicar</button><button class="btn sm ghost danger" data-del>${ic('trash')}Excluir</button></div>
        <details class="box" style="margin-bottom:14px"><summary class="strong" style="cursor:pointer">Mensagem</summary><div class="msg-prev" style="margin-top:10px">${esc(c.template+LGPD_FOOT)}</div></details>
        <div class="seg" style="margin-bottom:12px"><button class="${tab==='envios'?'on':''}" data-tab="envios">Envios · ${S2.length}</button><button class="${tab==='respostas'?'on':''}" data-tab="respostas">Respostas · ${RP.length}</button></div>
        ${tab==='envios'?(S2.length?`<div class="rtable st"><div class="rt-h"><span>Paciente</span><span>Telefone</span><span>Envio</span><span>Status</span></div>${S2.map(x=>`<div class="rt-r"><span class="strong">${esc(x.patient_name||P(x.patient_id)?.name||'—')}</span><span>${esc(maskPhone(String(x.phone).replace(/^55/,'')))}</span><span>${x.sent_at?new Date(x.sent_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}</span><span>${badge(SST,x.status)}${repBy.has(x.id)||x.replied_at?' <i class="badge info">Respondeu</i>':''}${x.error?` <i class="small muted" title="${esc(x.error)}">⚠</i>`:''}</span></div>`).join('')}</div>`:empty('send','Nada enviado ainda','Os envios aparecem aqui.'))
          :(RP.length?`<div class="stack">${RP.map(r=>`<div class="rep"><div class="row between wrap"><b>${esc(P(r.patient_id)?.name||r.phone)}</b><span class="small muted">${new Date(r.received_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span></div><div class="bubble b-in">${esc(r.text)}</div><div class="row wrap" style="gap:6px;margin-top:6px">${r.classification?badge(RCL,r.classification):'<span class="badge">Analisando…</span>'}${r.review_status==='pendente'?`<button class="btn sm" data-rv="${r.id}">Revisar</button>`:''}</div></div>`).join('')}</div>`:empty('inbox','Sem respostas ainda','Quando alguém responder pelo WhatsApp, aparece aqui.'))}`};
    m.refresh=draw;draw();
    el.addEventListener('click',async e=>{const c=CRM.campaigns.find(x=>x.id===id);const t=e.target;
      if(t.closest('[data-tab]')){tab=t.closest('[data-tab]').dataset.tab;draw()}
      else if(t.closest('[data-edit]')){m.close();openCampEditor(c)}
      else if(t.closest('[data-dup]')){m.close();openCampEditor({...c,status:'concluida'})}
      else if(t.closest('[data-manual]'))manualQueue(id);
      else if(t.closest('[data-pause]')){await crmUpdate('campaigns',id,{status:'pausada'});changed()}
      else if(t.closest('[data-resume]')){await crmUpdate('campaigns',id,{status:'enviando'});changed()}
      else if(t.closest('[data-cancelq]')){if(!await confirmBox('Cancelar as mensagens que ainda estão na fila?','Cancelar fila'))return;for(const x of CRM.sends.filter(x=>x.campaign_id===id&&x.status==='na_fila'))await crmUpdate('sends',x.id,{status:'cancelado'});await crmUpdate('campaigns',id,{status:'concluida'});changed()}
      else if(t.closest('[data-del]')){if(!await confirmBox('Excluir esta campanha, com os envios e as respostas?'))return;await crmDelete('campaigns',id);m.close();changed();toast('Campanha excluída')}
      else if(t.closest('[data-rv]'))openReviews(t.closest('[data-rv]').dataset.rv);
    });
  }});
}

function manualQueue(cid){const L=CRM.sends.filter(x=>x.campaign_id===cid&&x.status==='na_fila');if(!L.length){toast('Nada na fila');return}let i=0,sent=0;
  openModal({title:'Enviar pelo WhatsApp',size:'sm',body:'<div data-q></div>',onMount:(el,m)=>{
    const draw=()=>{const box=$('[data-q]',el);
      if(i>=L.length){box.innerHTML=`<div class="queue-card"><h3 style="justify-content:center;margin:6px 0">Pronto!</h3><div class="muted">${sent} de ${L.length} mensagens enviadas.</div><button class="btn dark" style="margin-top:18px;width:100%" data-end>Concluir</button></div>`;$('[data-end]',el).onclick=m.close;return}
      const x=L[i];box.innerHTML=`<div class="row between small muted"><span>${i+1} de ${L.length}</span><span>${sent} enviada${sent===1?'':'s'}</span></div><div class="progress"><i style="width:${i/L.length*100}%"></i></div>
        <div class="strong" style="margin-bottom:8px">${esc(x.patient_name)}</div><div class="msg-prev scroll" style="max-height:220px">${esc(x.message)}</div>
        <div class="row" style="margin-top:16px"><button class="btn" data-skip style="flex:1">Pular</button><button class="btn wa" data-go style="flex:2">${ic('wa')}Abrir no WhatsApp</button></div>
        <div class="small muted" style="margin-top:10px;text-align:center">Envie no WhatsApp e volte aqui para a próxima.</div>`;
      $('[data-skip]',el).onclick=()=>{i++;draw()};
      $('[data-go]',el).onclick=async()=>{window.open(`https://wa.me/${x.phone}?text=${encodeURIComponent(x.message)}`,'_blank');try{await crmUpdate('sends',x.id,{status:'manual',sent_at:new Date().toISOString()})}catch(e){}sent++;i++;draw()}};
    draw()},onClose:async()=>{const left=CRM.sends.some(x=>x.campaign_id===cid&&x.status==='na_fila');if(!left)try{await crmUpdate('campaigns',cid,{status:'concluida'})}catch(e){}changed()}});
}

function openReviews(onlyId){
  openModal({title:'Mensagens para revisar',size:'lg',body:'<div data-rvs></div>',onMount:(el,m)=>{
    const draw=()=>{const L=pendingReviews().filter(r=>!onlyId||r.id===onlyId);
      $('[data-rvs]',el).innerHTML=L.length?`<div class="small muted" style="margin-bottom:12px">A IA não teve certeza se a pessoa quer sair da lista ou se precisa de resposta.</div><div class="stack">${L.map(r=>{const c=CRM.campaigns.find(k=>k.id===r.campaign_id),pt=P(r.patient_id);return`<div class="rep"><div class="row between wrap"><b>${esc(pt?.name||r.phone)}</b><span class="small muted">${c?esc(c.name)+' · ':''}${new Date(r.received_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span></div><div class="bubble b-in">${esc(r.text)}</div>
        <div class="row wrap" style="gap:8px;margin-top:10px"><button class="btn sm ghost danger" data-out="${r.id}">Tirar da lista</button><button class="btn sm" data-keep="${r.id}">Manter</button><button class="btn sm dark" data-reply="${r.id}">${ic('wa')}Responder</button></div></div>`}).join('')}</div>`:empty('check','Tudo revisado','Nenhuma mensagem esperando.');};
    m.refresh=draw;draw();
    el.addEventListener('click',async e=>{const t=e.target,b=t.closest('[data-out],[data-keep],[data-reply]');if(!b)return;const id=b.dataset.out||b.dataset.keep||b.dataset.reply;const r=CRM.replies.find(x=>x.id===id);if(!r)return;
      if(b.dataset.out){await crmOptOut(r.patient_id,'revisao',r.text);await crmUpdate('replies',id,{review_status:'removido'});toast('Tirada da lista de campanhas')}
      else if(b.dataset.keep){await crmUpdate('replies',id,{review_status:'mantido'});toast('Mantida nas campanhas')}
      else{replyTo(r);return}
      changed();draw()});
  }});
}
function replyTo(r){const pt=P(r.patient_id);const phone=r.phone||pt?.phone;
  openModal({title:'Responder',size:'sm',body:`<div class="stack"><div class="bubble b-in">${esc(r.text)}</div><textarea class="in" data-rt style="min-height:120px" placeholder="Escreva a resposta…"></textarea></div>`,foot:`<button class="btn" data-c>Cancelar</button><button class="btn wa" data-s>${ic('wa')}Enviar</button>`,
    onMount:(el,m)=>{setTimeout(()=>$('[data-rt]',el).focus(),60);$('[data-c]',el).onclick=m.close;
      $('[data-s]',el).onclick=async()=>{const tx=$('[data-rt]',el).value.trim();if(!tx){toast('Escreva a resposta');return}
        if(evoOn()){try{await evoSend(phone,tx)}catch(e){toast('Falha no envio: '+e.message);return}}else window.open(`https://wa.me/${waNum(phone)}?text=${encodeURIComponent(tx)}`,'_blank');
        if(r.patient_id)logMsg(r.patient_id,'avulsa',tx);await crmUpdate('replies',r.id,{review_status:'respondido'});m.close();changed();toast('Resposta enviada')}}});
}

/* ================= seletor de paciente ================= */
function patientPicker(host,st){
  let typed='',hl=0,opts=[];
  const draw=()=>{
    if(st.patientId&&P(st.patientId)){const p=P(st.patientId);host.innerHTML=`<div class="pp-sel">${av(p.name)}<div class="grow" style="min-width:0"><div class="strong">${esc(p.name)}</div><div class="small muted">${esc(p.phone||'sem WhatsApp cadastrado')}</div></div><button type="button" class="btn sm ghost" data-ch>${ic('swap')}Trocar</button></div>`;$('[data-ch]',host).onclick=()=>{st.patientId='';draw();$('input',host).focus()};return}
    host.innerHTML=`<div class="pp"><div class="searchbar" style="max-width:none">${ic('search')}<input class="in" placeholder="Digite o nome — busque ou cadastre na hora" autocomplete="off"></div><div class="pp-drop scroll hide"></div></div>`;
    const inp=$('input',host),drop=$('.pp-drop',host);inp.value=typed;
    const list=()=>{const q=norm(typed);opts=db.patients.filter(p=>!q||norm(p.name).includes(q)||digits(p.phone).includes(digits(typed)||'#')).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8).map(p=>({p}));
      if(typed.trim()&&!db.patients.some(p=>norm(p.name)===q))opts.push({create:typed.trim()});
      hl=Math.min(hl,Math.max(0,opts.length-1));
      if(!opts.length){drop.classList.add('hide');return}
      drop.innerHTML=opts.map((o,i)=>o.create?`<button type="button" class="pp-opt ${i===hl?'hl':''}" data-i="${i}"><div class="avatar" style="background:var(--accent);color:#fff">${ic('plus','style="width:15px;height:15px"')}</div><div><div class="strong">Cadastrar “${esc(o.create)}”</div><div class="small muted">Cria o paciente só com o nome</div></div></button>`:`<button type="button" class="pp-opt ${i===hl?'hl':''}" data-i="${i}">${av(o.p.name)}<div style="min-width:0"><div class="strong">${esc(o.p.name)}</div><div class="small muted">${esc(o.p.phone||'—')}</div></div></button>`).join('');drop.classList.remove('hide')};
    const choose=i=>{const o=opts[i];if(!o)return;if(o.create){const p={id:uid(),name:o.create,createdAt:Date.now()};db.patients.push(p);save();st.patientId=p.id;toast('Paciente cadastrado')}else st.patientId=o.p.id;typed='';draw();st.onPick&&st.onPick()};
    inp.oninput=()=>{typed=inp.value;hl=0;list()};
    inp.onfocus=list;
    inp.onblur=()=>setTimeout(()=>drop.classList.add('hide'),160);
    inp.onkeydown=e=>{if(e.key==='ArrowDown'){hl=Math.min(hl+1,opts.length-1);list();e.preventDefault()}else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);list();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();choose(hl)}};
    drop.onmousedown=e=>{const b=e.target.closest('[data-i]');if(b){e.preventDefault();choose(+b.dataset.i)}};
  };
  draw();
  return{ensure(){if(st.patientId&&P(st.patientId))return st.patientId;if(typed.trim()){const ex=db.patients.find(p=>norm(p.name)===norm(typed));if(ex)return st.patientId=ex.id;const p={id:uid(),name:typed.trim(),createdAt:Date.now()};db.patients.push(p);return st.patientId=p.id}return''}};
}

/* ================= editor de procedimentos + desconto ================= */
function itemEditor(host,st){
  host.innerHTML=`${db.procedures.length>8?`<div class="searchbar" style="max-width:none;margin-bottom:10px">${ic('search')}<input class="in" placeholder="Filtrar procedimentos..." data-q style="height:38px"></div>`:''}
  <div class="chips ie-cat scroll" data-cat></div>
  <div class="ie-items" data-items></div>
  <button type="button" class="btn sm ghost" data-add style="margin-top:8px">${ic('plus')}Item avulso</button>
  <div class="row between wrap" style="margin-top:14px;gap:10px">
    <div class="row" style="gap:8px"><span class="small strong" style="color:var(--ink-2)">Desconto</span><div class="seg" data-dt><button type="button" data-v="pct">%</button><button type="button" data-v="val">R$</button></div><input class="in" data-dv inputmode="decimal" placeholder="0" style="width:96px;height:36px"></div>
    <div class="chips" data-qd>${[5,10,15,20].map(v=>`<button type="button" class="chip" data-v="${v}" style="height:30px">${v}%</button>`).join('')}</div>
  </div>
  <div class="totals" data-tot style="margin-top:12px"></div>`;
  let q='';
  const cat=$('[data-cat]',host),rows=$('[data-items]',host),tot=$('[data-tot]',host),dv=$('[data-dv]',host);
  const drawCat=()=>{const list=db.procedures.filter(p=>!q||norm(p.name).includes(q)).sort((a,b)=>(b.kind==='consulta')-(a.kind==='consulta'));cat.innerHTML=list.length?list.map(p=>{const n=st.items.filter(i=>i.procId===p.id).reduce((s,i)=>s+(+i.qty||1),0);return`<button type="button" class="chip ${n?'on':''} ${p.kind==='consulta'?'chip-derm':''}" data-p="${p.id}">${n?ic('check'):ic(p.kind==='consulta'?'steth':'plus')}${esc(p.name)} <span style="opacity:.6;font-weight:500">${money(p.price)}</span>${n>1?` ×${n}`:''}</button>`}).join(''):'<span class="small muted">Nenhum procedimento — cadastre na aba Procedimentos ou use “Item avulso”.</span>'};
  const drawTot=()=>{const c=calc(st);tot.innerHTML=`<div class="row small"><span class="muted">Subtotal</span><span>${money(c.sub)}</span></div><div class="row small"><span class="muted">Desconto${st.discountType==='pct'&&+st.discountValue?` (${fmtNum(st.discountValue).replace(',00','')}%)`:''}</span><span>${c.disc?'− '+money(c.disc):'—'}</span></div><div class="row" style="margin-top:4px;border-top:1px solid var(--line);padding-top:8px"><span class="strong">Total</span><span class="big">${money(c.total)}</span></div>`;$$('[data-qd] .chip',host).forEach(b=>b.classList.toggle('on',st.discountType==='pct'&&+b.dataset.v===+st.discountValue))};
  const drawRows=()=>{rows.innerHTML=st.items.length?`<div class="small muted" style="display:grid;grid-template-columns:1fr 64px 110px 32px;gap:8px;padding:0 8px"><span>Procedimento</span><span>Qtd</span><span>Valor (R$)</span><span></span></div>`+st.items.map((it,i)=>`<div class="ie-row" data-r="${i}"><input class="in" data-f="name" value="${esc(it.name)}" placeholder="Descrição"><input class="in" data-f="qty" type="number" min="1" value="${it.qty||1}"><input class="in" data-f="price" inputmode="decimal" value="${fmtNum(it.price)}"><button type="button" class="btn sm icon ghost danger" data-rm="${i}">${ic('x')}</button></div>`).join(''):'';drawCat();drawTot()};
  cat.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=db.procedures.find(x=>x.id===b.dataset.p);const ex=st.items.find(i=>i.procId===p.id);if(ex)ex.qty=(+ex.qty||1)+1;else st.items.push({procId:p.id,name:p.name,price:+p.price||0,qty:1});drawRows()};
  rows.oninput=e=>{const r=e.target.closest('[data-r]');if(!r)return;const it=st.items[+r.dataset.r],f=e.target.dataset.f;it[f]=f==='price'?parseMoney(e.target.value):f==='qty'?Math.max(1,parseInt(e.target.value)||1):e.target.value;drawTot();if(f!=='name')drawCat()};
  rows.addEventListener('focusout',e=>{if(e.target.dataset.f==='price'){const r=e.target.closest('[data-r]');e.target.value=fmtNum(st.items[+r.dataset.r].price)}});
  rows.onclick=e=>{const b=e.target.closest('[data-rm]');if(b){st.items.splice(+b.dataset.rm,1);drawRows()}};
  $('[data-add]',host).onclick=()=>{st.items.push({name:'',price:0,qty:1});drawRows();const ins=$$('[data-f="name"]',rows);ins[ins.length-1].focus()};
  const segs=$$('[data-dt] button',host),drawSeg=()=>segs.forEach(b=>b.classList.toggle('on',b.dataset.v===st.discountType));
  segs.forEach(b=>b.onclick=()=>{st.discountType=b.dataset.v;drawSeg();drawTot()});
  dv.value=+st.discountValue?fmtNum(st.discountValue).replace(',00',''):'';
  dv.oninput=()=>{st.discountValue=parseMoney(dv.value);drawTot()};
  $('[data-qd]',host).onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=+b.dataset.v;if(st.discountType==='pct'&&+st.discountValue===v){st.discountValue=0;dv.value=''}else{st.discountType='pct';st.discountValue=v;dv.value=v}drawSeg();drawTot()};
  const qi=$('[data-q]',host);if(qi)qi.oninput=()=>{q=norm(qi.value);drawCat()};
  drawSeg();drawRows();
}

/* ================= CONSULTA ================= */
const RET_OPTS=[['none','Sem retorno',0],['m1','1 mês',1],['m3','3 meses',3],['m6','6 meses',6],['m12','1 ano',12]];
function openAppt(o={}){
  const ex=o.id?db.appointments.find(a=>a.id===o.id):null;
  const st={patientId:ex?.patientId||o.patientId||'',date:ex?.date||o.date||today(),time:ex?.time||o.time||'',status:ex?.status||'',items:clone(ex?.items||o.items||[]),discountType:ex?.discountType||o.discountType||'pct',discountValue:ex?.discountValue??o.discountValue??0,notes:ex?.notes||o.notes||''};
  let touched=!!ex;if(!st.status)st.status=st.date<=today()?'realizada':'agendada';
  const exRet=ex?db.returns.find(r=>r.apptId===ex.id):null;
  const ret={mode:'none',date:''};
  if(exRet){ret.mode='custom';ret.date=exRet.date;RET_OPTS.forEach(([k,,m])=>{if(m&&addMonths(st.date,m)===exRet.date)ret.mode=k})}
  else if(!ex)ret.mode='m6';
  const retDate=()=>{const r=RET_OPTS.find(x=>x[0]===ret.mode);return ret.mode==='none'?'':ret.mode==='custom'?ret.date:addMonths(st.date,r[2])};
  openModal({title:ex?'Editar consulta':'Nova consulta',size:'lg',
    body:`<div class="stack">
      <div class="field"><span>Paciente <em>*</em></span><div data-pp></div></div>
      <div class="grid3">
        <div class="field"><span>Data da consulta</span><button type="button" class="in dateBtn" data-date></button></div>
        <label class="field"><span>Horário</span><input class="in" data-time inputmode="numeric" placeholder="Ex.: 14:30" maxlength="5" value="${esc(st.time)}" autocomplete="off"></label>
        <div class="field"><span>Status</span><div class="seg" data-st style="width:100%;display:flex">${Object.entries(ST).map(([k,[l]])=>`<button type="button" data-v="${k}" style="flex:1">${l}</button>`).join('')}</div></div>
      </div>
      <div class="box"><div class="lbl">Procedimentos e valores</div><div data-ie></div></div>
      <div class="box"><div class="lbl"><span>Retorno</span><span class="muted small" data-ri style="font-weight:500"></span></div><div class="chips" data-rc></div></div>
      <div class="field"><span>Observações</span><textarea class="in" data-notes placeholder="Anotações do atendimento, produtos usados, reações...">${esc(st.notes)}</textarea></div>
    </div>`,
    foot:`${ex?`<button class="btn ghost danger left" data-del>${ic('trash')}Excluir</button>`:''}<button class="btn" data-cancel>Cancelar</button><button class="btn dark" data-save>${ic('check')}Salvar consulta</button>`,
    onMount:(el,m)=>{
      const picker=patientPicker($('[data-pp]',el),st);
      itemEditor($('[data-ie]',el),st);
      const dBtn=$('[data-date]',el);
      const drawDate=()=>{dBtn.innerHTML=`<span>${cap(fmtLong(st.date))}</span>${ic('cal')}`};
      const drawSt=()=>$$('[data-st] button',el).forEach(b=>b.classList.toggle('on',b.dataset.v===st.status));
      const drawRet=()=>{const d=retDate();$('[data-rc]',el).innerHTML=RET_OPTS.map(([k,l])=>`<button type="button" class="chip ${ret.mode===k?'on':''}" data-k="${k}">${l}</button>`).join('')+`<button type="button" class="chip ${ret.mode==='custom'?'on':''}" data-k="custom">${ic('cal')}${ret.mode==='custom'&&ret.date?fmtD(ret.date):'Escolher data'}</button>`;$('[data-ri]',el).textContent=d?`${fmtD(d)} · ${relDays(d)}`:'nenhum retorno será lembrado'};
      drawDate();drawSt();drawRet();
      const ti=$('[data-time]',el);ti.oninput=()=>{const d=digits(ti.value).slice(0,4);ti.value=d.length>2?`${d.slice(0,2)}:${d.slice(2)}`:d};
      ti.onblur=()=>{const d=digits(ti.value);if(d.length===1||d.length===2)ti.value=`${pad(Math.min(23,+d))}:00`;else if(d.length===3)ti.value=`0${d[0]}:${d.slice(1)}`};
      dBtn.onclick=async()=>{const v=await pickDate(dBtn,st.date,[['Hoje',today()],['Amanhã',addDays(today(),1)],['+7 dias',addDays(today(),7)]]);if(v){st.date=v;if(!touched){st.status=v<=today()?'realizada':'agendada';drawSt()}drawDate();drawRet()}};
      $('[data-st]',el).onclick=e=>{const b=e.target.closest('[data-v]');if(b){st.status=b.dataset.v;touched=true;drawSt()}};
      $('[data-rc]',el).onclick=async e=>{const b=e.target.closest('[data-k]');if(!b)return;if(b.dataset.k==='custom'){const base=ret.date||addMonths(st.date,6);const v=await pickDate(b,base,[['2 meses',addMonths(st.date,2)],['4 meses',addMonths(st.date,4)],['9 meses',addMonths(st.date,9)]]);if(v){ret.mode='custom';ret.date=v}}else ret.mode=b.dataset.k;drawRet()};
      $('[data-cancel]',el).onclick=m.close;
      if(ex)$('[data-del]',el).onclick=async()=>{if(await confirmBox('Excluir esta consulta? O retorno vinculado também será removido.')){db.appointments=db.appointments.filter(a=>a.id!==ex.id);db.returns=db.returns.filter(r=>r.apptId!==ex.id);m.close();changed();toast('Consulta excluída')}};
      $('[data-save]',el).onclick=()=>{
        const pid=picker.ensure();if(!pid){toast('Informe o nome do paciente');$('[data-pp] input',el)?.focus();return}
        st.time=$('[data-time]',el).value;if(st.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(st.time)){toast('Horário inválido (use hh:mm)');return}st.notes=$('[data-notes]',el).value.trim();
        st.items=st.items.filter(i=>i.name.trim()||+i.price);
        const rec={...(ex||{}),id:ex?.id||uid(),patientId:pid,date:st.date,time:st.time,status:st.status,items:st.items,discountType:st.discountType,discountValue:+st.discountValue||0,notes:st.notes,budgetId:ex?.budgetId||o.budgetId||null,createdAt:ex?.createdAt||Date.now()};
        if(ex)Object.assign(ex,rec);else db.appointments.push(rec);
        const rd=st.status==='cancelada'?'':retDate();let r=db.returns.find(x=>x.apptId===rec.id);
        if(rd){if(r){if(r.date!==rd){r.date=rd;r.status='pendente';r.notifiedAt=null}r.patientId=pid;r.note=procNames(rec.items)||r.note}else db.returns.push({id:uid(),patientId:pid,date:rd,note:procNames(rec.items),status:'pendente',apptId:rec.id,createdAt:Date.now()})}
        else if(r)db.returns=db.returns.filter(x=>x!==r);
        let closed=0;
        if(!ex&&st.status!=='cancelada')db.returns.forEach(x=>{if(x.patientId===pid&&x.apptId!==rec.id&&x.status!=='concluido'&&x.date<=addDays(rec.date,45)&&(x.id===o.returnId||x.date>=addMonths(rec.date,-3))){x.status='concluido';x.doneAt=today();closed++}});
        if(o.returnId){const rr=db.returns.find(x=>x.id===o.returnId);if(rr&&rr.status!=='concluido'){rr.status='concluido';rr.doneAt=today();closed++}}
        if(o.budgetId){const b=db.budgets.find(x=>x.id===o.budgetId);if(b){b.status='aprovado';b.apptId=rec.id}}
        m.close();changed();toast(ex?'Consulta atualizada':closed?'Consulta salva · retorno anterior concluído':'Consulta salva')
      };
    }});
}

const fmtPhone=v=>{let d=digits(v);if(d.startsWith('55')&&d.length>11)d=d.slice(2);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:String(v||'').trim()};
function cellDate(v){if(v instanceof Date&&!isNaN(v))return{d:`${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`,t:v.getHours()||v.getMinutes()?`${pad2(v.getHours())}:${pad2(v.getMinutes())}`:''};
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(v||'').trim());if(m)return{d:`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`,t:m[4]?`${pad2(m[4])}:${m[5]}`:''};
  const m2=/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/.exec(String(v||'').trim());if(m2)return{d:`${m2[1]}-${m2[2]}-${m2[3]}`,t:m2[4]&&!(m2[4]==='00'&&m2[5]==='00')?`${m2[4]}:${m2[5]}`:''};return null}
function rowToPatient(get){

  if(t('rg'))p.rg=String(t('rg'));

  if(t('phone'))p.phone=fmtPhone(t('phone'));

  if(!p.phone&&f2.length&&digits(f2[0]).length===11)p.phone=f2[0];
  const ce=digits(t('cep'));if(ce.length===8)p.cep=`${ce.slice(0,5)}-${ce.slice(5)}`;
  const city=String(t('city')),ufRaw=String(t('uf')),uf=UFS[norm(ufRaw)]||ufRaw;
  const addr=[t('street'),t('bairro'),city&&uf?`${city}/${uf}`:city||uf].filter(Boolean).join(', ');if(addr)p.address=addr;
  if(t('num'))p.addrNum=String(t('num'));if(t('compl'))p.addrCompl=String(t('compl'));
  const ins=[t('ins'),t('plan'),t('card')&&'carteirinha '+t('card')].filter(Boolean).join(' · ');if(ins)p.insurance=ins;
  if(t('source'))p.source=String(t('source'));
  const resp=[t('resp'),t('respDoc')].filter(Boolean).join(' · ');if(resp)p.emergencyName=resp;
  const lv=cellDate(t('last'));if(lv){p.lastVisit=lv.d;p.lastVisitAt=lv.d+'T'+(lv.t||'00:00')}

  const mi=/Indicad[oa] por:[ \t]*(.*)/i.exec(obs);if(mi&&mi[1].trim()){p.referredBy=mi[1].trim();if(!p.source)p.source='Indicação'}
  obs=obs.replace(/^\s*[ÚU]ltima Visita:.*$/gim,'').replace(/^\s*Indicad[oa] por:.*$/gim,'').trim();
  if(obs)evo={id:uid(),patientId:p.id,type:'observacao',text:obs,at:p.lastVisitAt?new Date(p.lastVisitAt+':00').toISOString():new Date().toISOString(),author:'',pinned:false,imported:true,createdAt:new Date().toISOString()};

async function readSheets(files,onStep){
  await loadScript(XLSX_URL);const book=[];
  for(const f of files){const nm=f.name.toLowerCase();
    if(nm.endsWith('.zip')){await loadScript(JSZIP_URL);const z=await JSZip.loadAsync(f);const ent=Object.values(z.files).filter(e=>!e.dir&&!/(^|\/)(__MACOSX|\.)/.test(e.name)&&/\.(xlsx|xls|csv)$/i.test(e.name));
      for(const e of ent){book.push({name:e.name.split('/').pop(),data:await e.async('arraybuffer')});onStep&&onStep(book.length)}}
    else if(/\.(xlsx|xls|csv)$/.test(nm)){book.push({name:f.name,data:await f.arrayBuffer()});onStep&&onStep(book.length)}}
  const out=[];let rows=0,noName=0,badFiles=[];
  for(const b of book){let wb;try{wb=XLSX.read(b.data,{type:'array',cellDates:true})}catch(e){badFiles.push(b.name);continue}
    const ws=wb.Sheets[wb.SheetNames[0]];const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});if(!A.length)continue;
    const H=A[0].map(h=>norm(String(h||'')).replace(/\s+/g,' ').trim());const col={};
    for(const [k,names] of Object.entries(ICOLS)){const i=H.findIndex(h=>names.includes(h));if(i>-1)col[k]=i}
    if(col.name==null){badFiles.push(b.name);continue}
    for(const r of A.slice(1)){if(!r||r.every(v=>v==null||v===''))continue;rows++;const x=rowToPatient(k=>col[k]==null?null:r[col[k]]);if(x)out.push(x);else noName++}}
  return{items:out,files:book.length,rows,noName,badFiles}}

      <div class="small muted" style="margin:12px 0 0">Intervalo de ~${8}s entre mensagens para proteger seu número.</div>

      const g=$('[data-go]',el),e=$('[data-end]',el),s2=$('[data-stop]',el);if(g)g.onclick=run;if(e)e.onclick=m.close;if(s2)s2.onclick=()=>{stop=true;s2.disabled=true;s2.textContent='Parando…'}};
    const run=async()=>{running=true;stop=false;draw();

        try{const tx=fill(r._tpl||db.settings.template,retVars(r));await evoSend(p.phone,tx);logMsg(p.id,r._kind||'retorno',tx);st[i]='ok';r.status='avisado';r.notifiedAt=today();r._onSent&&r._onSent();save()}catch(e){st[i]='err';r._err=e.message}
        draw();if(i<L.length-1&&!stop){const d=(8)*1000;await wait(d*0.75+Math.random()*d*0.5)}}
      running=false;draw()};
    m.refresh=null;draw();
  },onClose:()=>{L.forEach(r=>delete r._err);S.retSel=null;changed()}});

  [['Blefaroplastia',6500,120],['Lipoaspiração de papada',5200,90]].forEach(([name,price,duration])=>{if(!db.procedures.some(x=>x.name===name))db.procedures.push({id:uid(),name,price,duration,kind:'procedimento',cat:'cirurgia'})});
  const blef=db.procedures.find(x=>x.name==='Blefaroplastia'),lipo=db.procedures.find(x=>x.name==='Lipoaspiração de papada');
  const surg=(pi,pr,date)=>db.appointments.push({id:uid(),patientId:ps[pi].id,date,time:'08:00',status:'realizada',items:[{procId:pr.id,name:pr.name,price:pr.price,qty:1}],discountType:'pct',discountValue:0,notes:'Cirurgia sem intercorrências.',createdAt:Date.now()});
  surg(2,blef,addMonths(t,-8));surg(5,lipo,addMonths(t,-4));surg(7,blef,addMonths(t,-11));
  if(cp){const mk=(pi,date,status,time)=>db.appointments.push({id:uid(),patientId:ps[pi].id,date,time,status,items:[{procId:cp.id,name:cp.name,price:cp.price,qty:1}],discountType:'pct',discountValue:0,notes:status==='realizada'?'Avaliação dermatológica completa. Rotina de cuidados prescrita.':'Renovação da consulta dermatológica.',createdAt:Date.now()});
    mk(0,addDays(addMonths(t,-6),10),'realizada','09:00');  // vence em ~10 dias
    mk(5,addDays(addMonths(t,-6),14),'realizada','10:00');  // vence em ~14 dias
    mk(3,addDays(addMonths(t,-6),-8),'realizada','15:00');  // venceu há ~8 dias
    mk(1,addDays(addMonths(t,-6),5),'realizada','11:00');mk(1,addDays(t,6),'agendada','16:30'); // renovação já agendada
    mk(8,addMonths(t,-3),'realizada','14:00');               // em dia
  }
  // campanhas de exemplo (ficam só neste navegador)
  const iso_=(d,h)=>new Date(parse(d).getTime()+h*3600e3).toISOString();
  const c1={id:uid(),name:'Revisão pós-cirurgia',filters:{...FDEF(),cat:'cirurgia'},template:'Olá, {nome}! ✨\n\nJá faz um tempo desde a sua {procedimento} ({data}). Que tal marcar a revisão para acompanharmos o resultado?',status:'concluida',created_at:iso_(addDays(t,-6),10)};
  const c2={id:uid(),name:'Aniversariantes do mês',filters:{...FDEF(),bday:'este'},template:'Feliz aniversário, {nome}! 🎉 Neste mês você tem um presente especial na {clinica}. Responda esta mensagem para saber mais.',status:'rascunho',created_at:iso_(addDays(t,-1),15)};
  const mk=(pi,c,h)=>({id:uid(),campaign_id:c.id,patient_id:ps[pi].id,patient_name:ps[pi].name,phone:waNum(ps[pi].phone),message:fill(c.template,{nome:ps[pi].socialName||first(ps[pi].name),procedimento:'blefaroplastia',data:fmtD(addMonths(t,-8)),clinica:'nossa clínica'})+LGPD_FOOT,status:'manual',created_at:c.created_at,sent_at:iso_(addDays(t,-6),h)});
  const s1=mk(2,c1,10.2),s2=mk(5,c1,10.4),s3=mk(7,c1,10.6);
  db.crm={campaigns:[c1,c2],sends:[s1,s2,s3],optouts:[],replies:[
    {id:uid(),campaign_id:c1.id,send_id:s1.id,patient_id:s1.patient_id,phone:s1.phone,text:'Oi! Quero marcar sim, pode ser semana que vem? 😊',classification:'normal',review_status:'ok',received_at:iso_(addDays(t,-6),11)},
    {id:uid(),campaign_id:c1.id,send_id:s2.id,patient_id:s2.patient_id,phone:s2.phone,text:'Quanto custa essa revisão? Estou sem tempo esses meses',classification:'duvida',review_status:'pendente',received_at:iso_(addDays(t,-5),9)},
    {id:uid(),campaign_id:c1.id,send_id:s3.id,patient_id:s3.patient_id,phone:s3.phone,text:'Por favor, não me mandem mais mensagens.',classification:'sair',review_status:'removido',received_at:iso_(addDays(t,-5),14)}]};
  db.crm.optouts.push({patient_id:s3.patient_id,source:'automatico',reason:'Por favor, não me mandem mais mensagens.',created_at:iso_(addDays(t,-5),14)});
  db.messages=(db.messages||[]).concat([{id:uid(),patientId:ps[0].id,at:iso_(addDays(t,-20),9),dir:'out',kind:'retorno',text:'Olá, Bia! Está chegando o momento do seu retorno. Vamos agendar?'}]);
  CRM.loaded=false;
  if(!db.settings.doctor)db.settings.doctor='Dra. Helena';if(!db.settings.clinic)db.settings.clinic='Helena Estética da Pele';
  S.retSel=null;
}

/* ================= início ================= */
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
