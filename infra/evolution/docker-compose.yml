# Evolution API (WhatsApp) para o sistema da clínica.
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d`.
services:
  evolution:
    # Confira a versão mais recente em https://hub.docker.com/r/evoapicloud/evolution-api/tags e fixe aqui
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_URL: https://${DOMINIO}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # HTTPS automático (Let's Encrypt) para o domínio da Evolution
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [evolution]

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
