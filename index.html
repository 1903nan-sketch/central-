<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumière · Estética</title>
<meta name="theme-color" content="#eef0f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2;
  --ink:#1d2127; --ink-2:#555d68; --ink-3:#8b929b; --ink-4:#b4bac2;
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.72); --glass-3:rgba(255,255,255,.88);
  --stroke:rgba(255,255,255,.75); --stroke-2:rgba(30,35,45,.07); --line:rgba(30,35,45,.08);
  --accent:#2a2e35; --accent-ink:#fff; --soft:#e6e9ee; --soft-2:#f3f4f7;
  --ok:#3d8a68; --ok-bg:rgba(61,138,104,.12);
  --warn:#a87318; --warn-bg:rgba(168,115,24,.12);
  --bad:#b4472e; --bad-bg:rgba(180,71,46,.1);
  --info:#4a6283; --info-bg:rgba(74,98,131,.11);
  --shadow:0 10px 40px -12px rgba(30,40,60,.18), 0 2px 6px -2px rgba(30,40,60,.06);
  --shadow-lg:0 30px 80px -20px rgba(30,40,60,.35);
  --r:22px; --r-sm:14px; --r-xs:10px;
  --blur:saturate(160%) blur(22px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
a.btn{text-decoration:none;color:var(--ink)}a.btn.wa{color:#fff}
/* ---------- background blobs ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#f8f9fb 0%,#e9ecf0 45%,#dfe3e8 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 26s var(--ease) infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:#ffffff}
.bg i:nth-child(2){width:38vw;height:38vw;right:-6vw;top:18vh;background:#cfd5dd;animation-duration:32s}
.bg i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-14vw;background:#f4f5f8;animation-duration:38s}
.bg i:nth-child(4){width:22vw;height:22vw;left:52vw;top:4vh;background:#d8dce3;opacity:.55;animation-duration:44s}
@keyframes float{to{transform:translate3d(4vw,3vh,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}*{transition:none!important;animation:none!important}}
/* ---------- glass ---------- */
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--shadow);border-radius:var(--r)}
/* ---------- scrollbars ---------- */
*{scrollbar-width:thin;scrollbar-color:rgba(40,45,55,.18) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(40,45,55,.16);border-radius:20px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(40,45,55,.3)}
.scroll{overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;height:100dvh;gap:18px;padding:18px}
.side{display:flex;flex-direction:column;padding:22px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#fff,#dde1e7);display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff,0 4px 14px -4px rgba(0,0,0,.18)}
.brand b{font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:600;letter-spacing:.3px;display:block;line-height:1}
.brand small{color:var(--ink-3);font-size:11.5px;letter-spacing:.4px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--ink-2);font-weight:500;transition:background .25s var(--ease),color .2s,transform .2s var(--ease);position:relative;text-align:left;width:100%}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav.on{background:var(--glass-3);color:var(--ink);box-shadow:0 6px 18px -8px rgba(30,40,60,.25),inset 0 0 0 1px #fff}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.view{flex:1;min-height:0;padding:6px 6px 40px}
.view.anim{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 6px 18px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.4px}
.topbar p{margin:2px 0 0;color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:13px;font-weight:550;font-weight:600;font-size:13.5px;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:0 4px 14px -6px rgba(30,40,60,.18);transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{background:#fff;box-shadow:0 8px 22px -8px rgba(30,40,60,.25)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn.dark{background:var(--accent);color:#fff;border-color:transparent}
.btn.dark:hover{background:#3a3f48}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.6)}
.btn.sm{height:32px;padding:0 11px;border-radius:10px;font-size:12.5px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn.danger{color:var(--bad)}
.btn.wa{background:#1f2a24;color:#fff;border-color:transparent}
.btn.wa:hover{background:#2b3a32}
.btn[disabled]{opacity:.45;pointer-events:none}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
.field>span em{color:var(--bad);font-style:normal}
.in{height:42px;width:100%;border-radius:12px;border:1px solid rgba(30,35,45,.09);background:rgba(255,255,255,.7);padding:0 13px;outline:none;transition:border .2s,box-shadow .2s,background .2s}
textarea.in{height:auto;min-height:84px;padding:11px 13px;resize:vertical}
.in:focus{border-color:rgba(42,46,53,.35);background:#fff;box-shadow:0 0 0 4px rgba(42,46,53,.07)}
.in::placeholder{color:var(--ink-4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.strong{font-weight:600}
.dateBtn{justify-content:space-between;display:flex;align-items:center;cursor:pointer;text-align:left}
.dateBtn svg{width:16px;height:16px;opacity:.6}
/* segmented & chips */
.seg{display:inline-flex;background:rgba(30,35,45,.06);padding:3px;border-radius:12px;gap:2px;position:relative}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(30,40,60,.18)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:30px;background:rgba(255,255,255,.66);border:1px solid rgba(30,35,45,.08);font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .2s var(--ease)}
.chip:hover{background:#fff;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px -6px rgba(30,35,45,.45)}
.chip svg{width:14px;height:14px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
/* checkbox */
.ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(30,35,45,.22);background:rgba(255,255,255,.8);display:grid;place-items:center;cursor:pointer;transition:all .18s var(--ease);flex:none;margin:0}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck:disabled{opacity:.35;cursor:not-allowed}
/* switch */
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:20px;background:rgba(30,35,45,.15);transition:.25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.25s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
/* ---------- cards ---------- */
.card{padding:20px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;letter-spacing:-.1px;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.stat .lbl svg{width:15px;height:15px}
.stat .val{font-size:24px;font-weight:600;letter-spacing:-.5px}
.stat .sub{font-size:11.5px;color:var(--ink-3)}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none;color:var(--ink);background:linear-gradient(145deg,#fff,#dfe3e9);box-shadow:inset 0 1px 0 #fff,0 3px 10px -4px rgba(0,0,0,.2)}
.avatar.lg{width:64px;height:64px;border-radius:20px;font-size:21px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:42px;height:42px;opacity:.35;margin-bottom:10px}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:4px}
/* ---------- calendar ---------- */
.agenda-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cal-head h2{margin:0;font-size:19px;font-weight:600;text-transform:capitalize;letter-spacing:-.3px}
.cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-week div{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);font-weight:600;text-align:center;padding:4px 0 8px}
.cal-days.slide{animation:fadeSlide .35s var(--ease)}
@keyframes fadeSlide{from{opacity:0;transform:translateX(var(--dir,0))}to{opacity:1;transform:none}}
.day{min-height:94px;border-radius:14px;padding:7px 7px 6px;text-align:left;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.55);transition:background .2s,transform .15s var(--ease),box-shadow .2s;position:relative;overflow:hidden}
.day:hover{background:rgba(255,255,255,.78)}
.day:active{transform:scale(.98)}
.day.out{opacity:.38}
.day .n{font-size:12.5px;font-weight:600;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.day.today .n{background:var(--accent);color:#fff}
.day.sel{background:#fff;box-shadow:0 10px 24px -10px rgba(30,40,60,.3),inset 0 0 0 1.5px rgba(42,46,53,.55)}
.pill{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(42,46,53,.08);color:var(--ink-2)}
.pill.c{background:var(--accent);color:#fff}
.pill.r{background:transparent;box-shadow:inset 0 0 0 1px rgba(42,46,53,.25);color:var(--ink-2)}
.pill.more{background:none;color:var(--ink-3);padding-left:2px}
.dots{display:none;gap:3px;margin-top:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.r{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.legend i.r{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.daypanel{position:sticky;top:0;padding:20px;max-height:calc(100dvh - 60px);display:flex;flex-direction:column}
.daypanel .dp-date{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:600}
.daypanel h2{margin:2px 0 14px;font-size:22px;font-weight:600;letter-spacing:-.4px;text-transform:capitalize}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);transition:background .2s,transform .15s var(--ease),box-shadow .2s;text-align:left;width:100%}
button.item:hover,.item.click:hover{background:rgba(255,255,255,.92);box-shadow:0 8px 20px -12px rgba(30,40,60,.3);cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;font-weight:700;background:var(--soft);padding:5px 8px;border-radius:9px;min-width:50px;text-align:center;flex:none}
.sec-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:600;margin:16px 2px 8px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:18px}
.banner .ic{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.banner .ic svg{width:20px;height:20px}
/* ---------- patients ---------- */
.searchbar{position:relative;flex:1;min-width:220px;max-width:420px}
.searchbar svg{z-index:2;pointer-events:none;position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.45}
.searchbar .in{padding-left:40px;background:var(--glass-2);border-color:var(--stroke);backdrop-filter:blur(10px)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .2s var(--ease),box-shadow .2s,background .2s;cursor:pointer}
.pcard:hover{transform:translateY(-3px);background:var(--glass-2);box-shadow:0 20px 40px -18px rgba(30,40,60,.35)}
.pcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.pcard .meta div{background:rgba(255,255,255,.55);padding:8px 10px;border-radius:11px}
.pcard .meta small{display:block;color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
/* ---------- table-ish list ---------- */
.tlist .item{padding:13px 14px}
.price{font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.strike{text-decoration:line-through;color:var(--ink-3);font-weight:500;font-size:12px}
/* ---------- returns ---------- */
.rbar{position:sticky;bottom:0;margin-top:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;z-index:5;background:var(--glass-3)}
.ritem.off{opacity:.55}
.ritem label{display:flex;align-items:center}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(232,235,240,.45);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);animation:fade .25s var(--ease)}
.overlay.closing{animation:fadeOut .2s var(--ease) forwards}
@keyframes fade{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.modal{width:min(620px,100%);max-height:min(88dvh,900px);display:flex;flex-direction:column;background:rgba(255,255,255,.78);backdrop-filter:saturate(170%) blur(30px);-webkit-backdrop-filter:saturate(170%) blur(30px);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:var(--shadow-lg);animation:pop .35s var(--ease);overflow:hidden}
.modal.lg{width:min(880px,100%)}
.modal.sm{width:min(420px,100%)}
.closing .modal{animation:popOut .2s var(--ease) forwards}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes popOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.3px}
.m-body{padding:18px 22px 22px;flex:1}
.m-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.5);flex-wrap:wrap}
.m-foot .left{margin-right:auto}
.grabber{display:none}
/* item editor */
.ie-items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ie-row{display:grid;grid-template-columns:1fr 64px 110px 32px;gap:8px;align-items:center;background:rgba(255,255,255,.6);padding:8px;border-radius:13px;border:1px solid rgba(255,255,255,.8);animation:pop .25s var(--ease)}
.ie-row .in{height:36px;border-radius:10px;padding:0 10px}
.ie-cat{max-height:132px;padding:2px}
.totals{background:rgba(255,255,255,.65);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.85)}
.totals .row{justify-content:space-between}
.totals .big{font-size:21px;font-weight:700;letter-spacing:-.4px}
.box{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);border-radius:18px;padding:14px}
.box>.lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
/* patient picker */
.pp{position:relative}
.pp-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;max-height:260px;animation:pop .2s var(--ease)}
.pp-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;width:100%;text-align:left}
.pp-opt:hover,.pp-opt.hl{background:var(--soft)}
.pp-opt .avatar{width:30px;height:30px;border-radius:10px;font-size:11px}
.pp-sel{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 6px;border-radius:13px;background:#fff;border:1px solid rgba(30,35,45,.09)}
.pp-sel .avatar{width:34px;height:34px;border-radius:11px;font-size:12px}
/* date picker popover */
.dp{position:fixed;z-index:80;width:300px;padding:14px;background:rgba(255,255,255,.92);backdrop-filter:saturate(170%) blur(26px);-webkit-backdrop-filter:saturate(170%) blur(26px);border:1px solid #fff;border-radius:22px;box-shadow:var(--shadow-lg);animation:pop .22s var(--ease)}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-h b{text-transform:capitalize;font-size:14px}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-g span{font-size:10.5px;color:var(--ink-3);text-align:center;font-weight:600;padding:4px 0}
.dp-g button{height:36px;border-radius:10px;font-size:13px;font-weight:500;transition:background .15s}
.dp-g button:hover{background:var(--soft)}

.dp-g button.t{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dp-g button.s{background:var(--accent);color:#fff}
.dp-q{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-q .chip{height:28px;font-size:11.5px;padding:0 10px}
.dp-back{position:fixed;inset:0;z-index:79}
/* folder */
.f-head{display:flex;gap:16px;align-items:center}
.f-head h2{margin:0;font-size:22px}
.f-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.f-stats div{background:rgba(255,255,255,.6);border-radius:15px;padding:12px 14px;border:1px solid rgba(255,255,255,.85)}
.f-stats small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.f-stats b{font-size:16px;letter-spacing:-.2px}
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--ink-4),transparent);border-radius:2px}
.tl-i{position:relative;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:12px 14px}
.tl-i::before{content:"";position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ink-2)}
.tl-i .procs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;white-space:pre-wrap}
/* toast */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(29,33,39,.9);color:#fff;padding:11px 18px;border-radius:14px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-lg);backdrop-filter:blur(10px);animation:toastIn .35s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
/* menu */
.menu{position:fixed;z-index:85;min-width:190px;padding:6px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid #fff;border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .18s var(--ease)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:10px;font-size:13.5px;font-weight:500;text-align:left}
.menu button:hover{background:var(--soft)}
.menu button svg{width:16px;height:16px;opacity:.7}
.menu button.danger{color:var(--bad)}
.queue-card{text-align:center;padding:10px 0}
.progress{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s var(--ease)}
.msg-prev{white-space:pre-wrap;background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:13.5px;text-align:left;box-shadow:0 4px 14px -8px rgba(0,0,0,.2);border:1px solid rgba(30,35,45,.05)}
.tabbar{display:none}
.hide{display:none!important}
/* ---------- responsive ---------- */
@media (max-width:1180px){.agenda-grid{grid-template-columns:1fr}.daypanel{position:static;max-height:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){

  .tabbar .nav{flex-direction:column;gap:3px;padding:7px 4px;font-size:10.5px;border-radius:16px;align-items:center;flex:1}

  .day{min-height:52px;padding:5px;border-radius:11px;align-items:center}
  .day .pill{display:none}
  .day .dots{display:flex}
  .cal-week,.cal-days{gap:4px}
  .stats{gap:10px}
  .stat{padding:13px 14px}.stat .val{font-size:20px}
  .grid2,.grid3{grid-template-columns:1fr}

  @keyframes sheetOut{to{transform:translateY(100%)}}

  .btn-label{display:none}
}

function toast(msg){const box=$('#toasts');[...box.children].forEach(c=>{if(c.textContent===msg)c.remove()});while(box.children.length>=2)box.firstChild.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateY(8px)'},2600);setTimeout(()=>t.remove(),2950)}
const layers=[];

function openModal({title,size='',body,foot='',onMount,onClose}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true"><div class="grabber"></div><div class="m-head"><h2>${title}</h2><button class="btn icon ghost" data-x aria-label="Fechar">${ic('x')}</button></div><div class="m-body scroll">${body}</div>${foot?`<div class="m-foot">${foot}</div>`:''}</div>`;
  document.body.appendChild(ov);
  const m={el:ov,refresh:null,close(){if(m.closed)return;m.closed=true;ov.classList.add('closing');setTimeout(()=>ov.remove(),210);const i=layers.indexOf(m);if(i>-1)layers.splice(i,1);onClose&&onClose()}};
  layers.push(m);
  ov.addEventListener('mousedown',e=>{m.down=e.target===ov});
  ov.addEventListener('click',e=>{if(e.target===ov&&m.down)m.close()});
  $('[data-x]',ov).onclick=m.close;
  onMount&&onMount(ov,m);

}

function place(el,anchor,w){const r=anchor.getBoundingClientRect(),h=el.offsetHeight;w=w||el.offsetWidth;let left=Math.min(Math.max(10,r.right-w),innerWidth-w-10);if(r.left+w<innerWidth-10)left=Math.max(10,Math.min(r.left,innerWidth-w-10));let top=r.bottom+8;if(top+h>innerHeight-10)top=Math.max(10,r.top-h-8);el.style.left=left+'px';el.style.top=top+'px'}
function floating(cls){const back=document.createElement('div');back.className='dp-back';const el=document.createElement('div');el.className=cls;document.body.append(back,el);const L={close(){back.remove();el.remove();const i=layers.indexOf(L);if(i>-1)layers.splice(i,1);L.onClose&&L.onClose()}};layers.push(L);back.onclick=()=>L.close();return{el,L}}

function pickDate(anchor,val,quick){return new Promise(res=>{
  const{el,L}=floating('dp');let done=false;const cur=parse(val||today());cur.setDate(1);
  const fin=v=>{if(done)return;done=true;L.close();res(v)};L.onClose=()=>{if(!done){done=true;res(null)}};
  const draw=()=>{const y=cur.getFullYear(),m=cur.getMonth(),start=new Date(y,m,1-new Date(y,m,1).getDay()),t=today();let c='';
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);c+=`<button data-d="${s}" class="${d.getMonth()!==m?'o':''} ${s===t?'t':''} ${s===val?'s':''}">${d.getDate()}</button>`}
    el.innerHTML=`<div class="dp-h"><button class="btn sm icon ghost" data-p>${ic('chevL')}</button><b>${MONTHS[m]} ${y}</b><button class="btn sm icon ghost" data-n>${ic('chevR')}</button></div><div class="dp-g">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}${c}</div>${quick?`<div class="dp-q">${quick.map(([l,v])=>`<button class="chip" data-d="${v}">${l}</button>`).join('')}</div>`:''}`};
  draw();place(el,anchor,300);
  el.onclick=e=>{if(e.target.closest('[data-p]')){cur.setMonth(cur.getMonth()-1);draw()}else if(e.target.closest('[data-n]')){cur.setMonth(cur.getMonth()+1);draw()}else{const d=e.target.closest('[data-d]');if(d)fin(d.dataset.d)}};

function summaryNeeded(){const k=mShift(mKey(today()),1);return db.settings.lastSummary!==k&&new Date().getDate()>=(+db.settings.summaryDay||1)&&returnsOfMonth(k).length>0}

  const apT=db.appointments.filter(a=>a.date===t&&a.status!=='cancelada');
  const mon=db.appointments.filter(a=>mKey(a.date)===mk);
  const rev=mon.filter(a=>a.status==='realizada').reduce((s,a)=>s+calc(a).total,0);
  const prev=mon.filter(a=>a.status==='agendada').reduce((s,a)=>s+calc(a).total,0);

  else if(summaryNeeded())html+=`<div class="banner glass"><div class="ic">${ic('bell')}</div><div style="flex:1"><b>Retornos de ${mName(nk)}: ${rn.length} paciente${rn.length>1?'s':''}</b><div class="small muted">Sua lista do próximo mês está pronta para organizar a agenda.</div></div><button class="btn" data-act="goRet">Ver lista</button><button class="btn wa" data-act="sendSummary">${ic('wa')}<span class="btn-label">Enviar no meu WhatsApp</span></button></div>`;
  html+=`<div class="stats glass">
    <div class="stat"><span class="lbl">${ic('clock')}Hoje</span><span class="val">${apT.length}</span><span class="sub">consulta${apT.length===1?'':'s'} agendada${apT.length===1?'':'s'}</span></div>

    <div class="stat"><span class="lbl">${ic('users')}Pacientes</span><span class="val">${db.patients.length}</span><span class="sub">${newP} novo${newP===1?'':'s'} este mês</span></div>

function calHTML(){
  const k=S.calMonth,y=+k.slice(0,4),m=+k.slice(5,7)-1,f1=new Date(y,m,1),start=new Date(y,m,1-f1.getDay());
  const weeks=Math.ceil((f1.getDay()+new Date(y,m+1,0).getDate())/7),t=today();

/* ================= seletor de paciente ================= */
function patientPicker(host,st){
  let typed='',hl=0,opts=[];
  const draw=()=>{
    if(st.patientId&&P(st.patientId)){const p=P(st.patientId);host.innerHTML=`<div class="pp-sel">${av(p.name)}<div class="grow" style="min-width:0"><div class="strong">${esc(p.name)}</div><div class="small muted">${esc(p.phone||'sem WhatsApp cadastrado')}</div></div><button type="button" class="btn sm ghost" data-ch>${ic('swap')}Trocar</button></div>`;$('[data-ch]',host).onclick=()=>{st.patientId='';draw();$('input',host).focus()};return}
    host.innerHTML=`<div class="pp"><div class="searchbar" style="max-width:none">${ic('search')}<input class="in" placeholder="Digite o nome — busque ou cadastre na hora" autocomplete="off"></div><div class="pp-drop scroll hide"></div></div>`;
    const inp=$('input',host),drop=$('.pp-drop',host);inp.value=typed;
    const list=()=>{const q=norm(typed);opts=db.patients.filter(p=>!q||norm(p.name).includes(q)||digits(p.phone).includes(digits(typed)||'#')).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8).map(p=>({p}));
      if(typed.trim()&&!db.patients.some(p=>norm(p.name)===q))opts.push({create:typed.trim()});
      hl=Math.min(hl,Math.max(0,opts.length-1));
      if(!opts.length){drop.classList.add('hide');return}
      drop.innerHTML=opts.map((o,i)=>o.create?`<button type="button" class="pp-opt ${i===hl?'hl':''}" data-i="${i}"><div class="avatar" style="background:var(--accent);color:#fff">${ic('plus','style="width:15px;height:15px"')}</div><div><div class="strong">Cadastrar “${esc(o.create)}”</div><div class="small muted">Cria o paciente só com o nome</div></div></button>`:`<button type="button" class="pp-opt ${i===hl?'hl':''}" data-i="${i}">${av(o.p.name)}<div style="min-width:0"><div class="strong">${esc(o.p.name)}</div><div class="small muted">${esc(o.p.phone||'—')}</div></div></button>`).join('');drop.classList.remove('hide')};
    const choose=i=>{const o=opts[i];if(!o)return;if(o.create){const p={id:uid(),name:o.create,createdAt:Date.now()};db.patients.push(p);save();st.patientId=p.id;toast('Paciente cadastrado')}else st.patientId=o.p.id;typed='';draw();st.onPick&&st.onPick()};
    inp.oninput=()=>{typed=inp.value;hl=0;list()};
    inp.onfocus=list;
    inp.onblur=()=>setTimeout(()=>drop.classList.add('hide'),160);
    inp.onkeydown=e=>{if(e.key==='ArrowDown'){hl=Math.min(hl+1,opts.length-1);list();e.preventDefault()}else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);list();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();choose(hl)}};
    drop.onmousedown=e=>{const b=e.target.closest('[data-i]');if(b){e.preventDefault();choose(+b.dataset.i)}};
  };
  draw();
  return{ensure(){if(st.patientId&&P(st.patientId))return st.patientId;if(typed.trim()){const ex=db.patients.find(p=>norm(p.name)===norm(typed));if(ex)return st.patientId=ex.id;const p={id:uid(),name:typed.trim(),createdAt:Date.now()};db.patients.push(p);return st.patientId=p.id}return''}};
}

  const drawRows=()=>{rows.innerHTML=st.items.length?`<div class="small muted" style="display:grid;grid-template-columns:1fr 64px 110px 32px;gap:8px;padding:0 8px"><span>Procedimento</span><span>Qtd</span><span>Valor (R$)</span><span></span></div>`+st.items.map((it,i)=>`<div class="ie-row" data-r="${i}"><input class="in" data-f="name" value="${esc(it.name)}" placeholder="Descrição"><input class="in" data-f="qty" type="number" min="1" value="${it.qty||1}"><input class="in" data-f="price" inputmode="decimal" value="${fmtNum(it.price)}"><button type="button" class="btn sm icon ghost danger" data-rm="${i}">${ic('x')}</button></div>`).join(''):'';drawCat();drawTot()};

const RET_OPTS=[['none','Sem retorno',0],['m1','1 mês',1],['m3','3 meses',3],['m6','6 meses',6],['m12','1 ano',12]];
function openAppt(o={}){
  const ex=o.id?db.appointments.find(a=>a.id===o.id):null;
  const st={patientId:ex?.patientId||o.patientId||'',date:ex?.date||o.date||today(),time:ex?.time||o.time||'',status:ex?.status||'',items:clone(ex?.items||o.items||[]),discountType:ex?.discountType||o.discountType||'pct',discountValue:ex?.discountValue??o.discountValue??0,notes:ex?.notes||o.notes||''};
  let touched=!!ex;if(!st.status)st.status=st.date<=today()?'realizada':'agendada';
  const exRet=ex?db.returns.find(r=>r.apptId===ex.id):null;
  const ret={mode:'none',date:''};
  if(exRet){ret.mode='custom';ret.date=exRet.date;RET_OPTS.forEach(([k,,m])=>{if(m&&addMonths(st.date,m)===exRet.date)ret.mode=k})}
  else if(!ex)ret.mode='m6';
  const retDate=()=>{const r=RET_OPTS.find(x=>x[0]===ret.mode);return ret.mode==='none'?'':ret.mode==='custom'?ret.date:addMonths(st.date,r[2])};
  openModal({title:ex?'Editar consulta':'Nova consulta',size:'lg',
    body:`<div class="stack">

        <div class="field"><span>Horário</span><input class="in" type="time" data-time value="${esc(st.time)}"></div>
        <div class="field"><span>Status</span><div class="seg" data-st style="width:100%;display:flex">${Object.entries(ST).map(([k,[l]])=>`<button type="button" data-v="${k}" style="flex:1">${l}</button>`).join('')}</div></div>
      </div>
      <div class="box"><div class="lbl">Procedimentos e valores</div><div data-ie></div></div>
      <div class="box"><div class="lbl"><span>Retorno</span><span class="muted small" data-ri style="font-weight:500"></span></div><div class="chips" data-rc></div></div>
      <div class="field"><span>Observações</span><textarea class="in" data-notes placeholder="Anotações do atendimento, produtos usados, reações...">${esc(st.notes)}</textarea></div>
    </div>`,
    foot:`${ex?`<button class="btn ghost danger left" data-del>${ic('trash')}Excluir</button>`:''}<button class="btn" data-cancel>Cancelar</button><button class="btn dark" data-save>${ic('check')}Salvar consulta</button>`,
    onMount:(el,m)=>{
      const picker=patientPicker($('[data-pp]',el),st);
      itemEditor($('[data-ie]',el),st);
      const dBtn=$('[data-date]',el);
      const drawDate=()=>{dBtn.innerHTML=`<span>${cap(fmtLong(st.date))}</span>${ic('cal')}`};
      const drawSt=()=>$$('[data-st] button',el).forEach(b=>b.classList.toggle('on',b.dataset.v===st.status));
      const drawRet=()=>{const d=retDate();$('[data-rc]',el).innerHTML=RET_OPTS.map(([k,l])=>`<button type="button" class="chip ${ret.mode===k?'on':''}" data-k="${k}">${l}</button>`).join('')+`<button type="button" class="chip ${ret.mode==='custom'?'on':''}" data-k="custom">${ic('cal')}${ret.mode==='custom'&&ret.date?fmtD(ret.date):'Escolher data'}</button>`;$('[data-ri]',el).textContent=d?`${fmtD(d)} · ${relDays(d)}`:'nenhum retorno será lembrado'};
      drawDate();drawSt();drawRet();

      $('[data-st]',el).onclick=e=>{const b=e.target.closest('[data-v]');if(b){st.status=b.dataset.v;touched=true;drawSt()}};
      $('[data-rc]',el).onclick=async e=>{const b=e.target.closest('[data-k]');if(!b)return;if(b.dataset.k==='custom'){const base=ret.date||addMonths(st.date,6);const v=await pickDate(b,base,[['2 meses',addMonths(st.date,2)],['4 meses',addMonths(st.date,4)],['9 meses',addMonths(st.date,9)]]);if(v){ret.mode='custom';ret.date=v}}else ret.mode=b.dataset.k;drawRet()};

      $('[data-save]',el).onclick=()=>{
        const pid=picker.ensure();if(!pid){toast('Informe o nome do paciente');$('[data-pp] input',el)?.focus();return}

        if(ex)Object.assign(ex,rec);else db.appointments.push(rec);

        if(rd){if(r){if(r.date!==rd){r.date=rd;r.status='pendente';r.notifiedAt=null}r.patientId=pid;r.note=procNames(rec.items)||r.note}else db.returns.push({id:uid(),patientId:pid,date:rd,note:procNames(rec.items),status:'pendente',apptId:rec.id,createdAt:Date.now()})}

        if(!ex&&st.status!=='cancelada')db.returns.forEach(x=>{if(x.patientId===pid&&x.apptId!==rec.id&&x.status!=='concluido'&&x.date<=addDays(rec.date,45)&&(x.id===o.returnId||x.date>=addMonths(rec.date,-3))){x.status='concluido';x.doneAt=today();closed++}});
        if(o.returnId){const rr=db.returns.find(x=>x.id===o.returnId);if(rr&&rr.status!=='concluido'){rr.status='concluido';rr.doneAt=today();closed++}}
        if(o.budgetId){const b=db.budgets.find(x=>x.id===o.budgetId);if(b){b.status='aprovado';b.apptId=rec.id}}
        m.close();changed();toast(ex?'Consulta atualizada':closed?'Consulta salva · retorno anterior concluído':'Consulta salva')
      };
    }});
}

function patientStats(id){
  const A=db.appointments.filter(a=>a.patientId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const done=A.filter(a=>a.status==='realizada');
  const nextR=activeReturns().filter(r=>r.patientId===id).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nextA=A.filter(a=>a.status==='agendada'&&a.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];

}
function vPacientes(){
  return topbar('Suas <em>pacientes</em>',`${db.patients.length} cadastrado${db.patients.length===1?'':'s'} · cada paciente tem sua pasta completa`,`<button class="btn dark" data-act="newPatient">${ic('plus')}Novo paciente</button>`)+
  `<div class="row wrap" style="margin-bottom:16px;gap:10px"><div class="searchbar">${ic('search')}<input class="in" placeholder="Buscar por nome ou telefone..." data-inp="pq" value="${esc(S.pq)}"></div>
  <div class="seg">${[['recent','Recentes'],['az','A–Z'],['ret','Próx. retorno'],['value','Maior valor']].map(([k,l])=>`<button class="${S.psort===k?'on':''}" data-act="psort" data-id="${k}">${l}</button>`).join('')}</div></div>
  <div id="plist">${pListHTML()}</div>`;
}
function pListHTML(){
  if(!db.patients.length)return`<div class="glass">${empty('users','Nenhum paciente ainda','Cadastre com apenas o nome — rápido e prático.',`<button class="btn dark" data-act="newPatient">${ic('plus')}Cadastrar paciente</button>`)}</div>`;
  const q=norm(S.pq),qd=digits(S.pq);
  let L=db.patients.filter(p=>!q||norm(p.name).includes(q)||(qd&&digits(p.phone).includes(qd))).map(p=>({p,s:patientStats(p.id)}));
  const srt={recent:(a,b)=>(b.s.last||'').localeCompare(a.s.last||'')||(b.p.createdAt||0)-(a.p.createdAt||0),az:(a,b)=>a.p.name.localeCompare(b.p.name),ret:(a,b)=>(a.s.nextR?.date||'9').localeCompare(b.s.nextR?.date||'9'),value:(a,b)=>b.s.total-a.s.total};
  L.sort(srt[S.psort]);
  if(!L.length)return`<div class="glass">${empty('search','Nada encontrado',`Nenhum paciente para “${esc(S.pq)}”.`,`<button class="btn dark" data-act="quickCreate">${ic('plus')}Cadastrar “${esc(S.pq)}”</button>`)}</div>`;
  return`<div class="pgrid">${L.map(({p,s})=>`<div class="pcard glass" data-act="folder" data-id="${p.id}">
    <div class="row">${av(p.name)}<div class="grow" style="min-width:0;flex:1"><div class="strong" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div><div class="small muted">${esc(p.phone||'sem WhatsApp')}</div></div>${p.phone?`<a class="btn sm icon" href="${waLink(p.phone,`Olá, ${first(p.name)}!`)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="WhatsApp">${ic('wa')}</a>`:''}</div>
    <div class="meta"><div><small>Última visita</small>${s.last?fmtD(s.last):'—'}</div><div><small>Retorno</small>${s.nextR?fmtD(s.nextR.date):'—'}</div><div><small>Atendimentos</small>${s.done.length}</div><div><small>Investido</small>${money(s.total)}</div></div>
  </div>`).join('')}</div>`;
}
INP.pq=el=>{S.pq=el.value;$('#plist').innerHTML=pListHTML()};
ACT.psort=k=>{S.psort=k;render()};
ACT.quickCreate=()=>{const p={id:uid(),name:S.pq.trim(),createdAt:Date.now()};db.patients.push(p);S.pq='';changed();toast('Paciente cadastrado');openFolder(p.id)};

/* ================= PASTA DO PACIENTE ================= */
function openFolder(id,tab='hist'){
  let cur=tab;
  const m=openModal({title:'Pasta do paciente',size:'lg',body:'<div data-fb></div>',
    foot:`<button class="btn" data-nb>${ic('doc')}Orçamento</button><button class="btn dark" data-na>${ic('plus')}Nova consulta</button>`,
    onMount:(el,mm)=>{
      $('[data-nb]',el).onclick=()=>openBudget({patientId:id});
      $('[data-na]',el).onclick=()=>openAppt({patientId:id,date:today()});
      mm.refresh=()=>{if(!P(id)){mm.close();return}draw()};
      const draw=()=>{const p=P(id),s=patientStats(id),B=db.budgets.filter(b=>b.patientId===id).sort((a,b)=>b.date.localeCompare(a.date)),R=db.returns.filter(r=>r.patientId===id).sort((a,b)=>b.date.localeCompare(a.date));
        const a=age(p.birth);
        let body='';
        if(cur==='hist')body=s.A.length?`<div class="tl">${s.A.map(x=>{const c=calc(x);return`<div class="tl-i click item" style="display:block" data-ea="${x.id}"><div class="row between wrap"><div class="row"><b>${fmtD(x.date)}</b>${x.time?`<span class="muted small">${x.time}</span>`:''}${badge(ST,x.status)}</div><div class="price">${c.disc?`<span class="strike">${money(c.sub)}</span> `:''}${money(c.total)}</div></div>
            ${x.items.length?`<div class="procs">${x.items.map(i=>`<span class="badge">${esc(i.name)}${(+i.qty||1)>1?' ×'+i.qty:''} · ${money(i.price*(i.qty||1))}</span>`).join('')}</div>`:''}
            ${c.disc?`<div class="small muted" style="margin-top:6px">Desconto de ${money(c.disc)}${x.discountType==='pct'?` (${x.discountValue}%)`:''}</div>`:''}
            ${x.notes?`<div class="small" style="margin-top:8px;color:var(--ink-2);white-space:pre-wrap">${esc(x.notes)}</div>`:''}</div>`}).join('')}</div>`:empty('clock','Sem atendimentos','Registre a primeira consulta desta paciente.');
        if(cur==='orc')body=B.length?`<div class="list">${B.map(b=>`<button class="item" data-eb="${b.id}">${ic('doc','style="width:20px;height:20px;opacity:.6"')}<div class="grow"><div class="t">${esc(procNames(b.items)||'Orçamento')}</div><div class="s">${fmtD(b.date)} · ${b.items.length} item(ns)</div></div><div style="text-align:right"><div class="price small">${money(calc(b).total)}</div>${badge(BST,b.status)}</div></button>`).join('')}</div>`:empty('doc','Sem orçamentos','Crie um orçamento para informar os valores.');
        if(cur==='ret')body=R.length?`<div class="list">${R.map(r=>`<div class="item"><span class="time">${fmtDM(r.date)}</span><div class="grow"><div class="t">${esc(r.note||'Retorno')}</div><div class="s">${fmtD(r.date)} · ${relDays(r.date)}</div></div>${badge(RST,r.status)}<button class="btn sm icon ghost" data-rm="${r.id}">${ic('more')}</button></div>`).join('')}</div>`:empty('ret','Sem retornos','Os retornos são criados ao salvar uma consulta.');
        if(cur==='ficha')body=`<dl class="kv"><dt>Nome</dt><dd>${esc(p.name)}</dd><dt>WhatsApp</dt><dd>${esc(p.phone||'—')}</dd><dt>Nascimento</dt><dd>${p.birth?`${fmtD(p.birth)} (${a} anos)`:'—'}</dd><dt>E-mail</dt><dd>${esc(p.email||'—')}</dd><dt>Tipo de pele</dt><dd>${esc(p.skin||'—')}</dd><dt>Alergias</dt><dd>${esc(p.allergies||'—')}</dd><dt>Observações</dt><dd>${esc(p.notes||'—')}</dd><dt>Cliente desde</dt><dd>${p.createdAt?new Date(p.createdAt).toLocaleDateString('pt-BR'):'—'}</dd></dl>`;
        $('[data-fb]',el).innerHTML=`<div class="f-head">${av(p.name,'lg')}<div style="flex:1;min-width:0"><h2>${esc(p.name)}</h2><div class="muted small">${[p.phone,a!==''?a+' anos':'',p.skin?'pele '+p.skin.toLowerCase():''].filter(Boolean).map(esc).join(' · ')||'Ficha básica'}</div></div>
          <div class="row">${p.phone?`<a class="btn wa sm" href="${waLink(p.phone,`Olá, ${first(p.name)}!`)}" target="_blank" rel="noopener">${ic('wa')}<span class="btn-label">WhatsApp</span></a>`:''}<button class="btn sm icon" data-pm>${ic('more')}</button></div></div>
          ${p.allergies?`<div class="badge bad" style="margin-top:12px">⚠ ${esc(p.allergies)}</div>`:''}
          <div class="f-stats"><div><small>Investido</small><b>${money(s.total)}</b></div><div><small>Atendimentos</small><b>${s.done.length}</b></div><div><small>Última visita</small><b>${s.last?fmtD(s.last):'—'}</b></div><div><small>Próx. retorno</small><b>${s.nextR?fmtD(s.nextR.date):'—'}</b></div></div>
          <div class="seg" data-tabs style="margin-bottom:14px">${[['hist','Histórico'],['orc','Orçamentos'],['ret','Retornos'],['ficha','Ficha']].map(([k,l])=>`<button class="${cur===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
          <div style="animation:viewIn .3s var(--ease)">${body}</div>`;
      };
      el.addEventListener('click',e=>{
        const t=e.target.closest('[data-t]');if(t){cur=t.dataset.t;draw();return}
        const ea=e.target.closest('[data-ea]');if(ea)return openAppt({id:ea.dataset.ea});
        const eb=e.target.closest('[data-eb]');if(eb)return openBudget({id:eb.dataset.eb});
        const rm=e.target.closest('[data-rm]');if(rm)return returnMenu(rm,rm.dataset.rm);
        const pm=e.target.closest('[data-pm]');if(pm)openMenu(pm,[{label:'Editar dados',icon:'edit',fn:()=>openPatient(id,()=>{})},{label:'Novo retorno manual',icon:'ret',fn:()=>openReturn({patientId:id})},{label:'Excluir paciente',icon:'trash',danger:true,fn:async()=>{if(await deletePatient(id))mm.close()}}]);
      });
      draw();
    }});
  return m;
}

/* ================= ORÇAMENTOS ================= */
function vOrcamentos(){
  const L=db.budgets.filter(b=>S.bf==='todos'||b.status===S.bf).filter(b=>!S.bq||norm(P(b.patientId)?.name).includes(norm(S.bq))).sort((a,b)=>b.date.localeCompare(a.date));
  const open=db.budgets.filter(b=>b.status==='aberto'),conv=db.budgets.filter(b=>b.status==='aprovado');
  return topbar('<em>Orçamentos</em>','Monte valores, aplique descontos e envie pelo WhatsApp',`<button class="btn dark" data-act="newBudget">${ic('plus')}Novo orçamento</button>`)+
  `<div class="stats glass" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span class="lbl">Em aberto</span><span class="val">${open.length}</span><span class="sub">${money(open.reduce((s,b)=>s+calc(b).total,0))}</span></div><div class="stat"><span class="lbl">Aprovados</span><span class="val">${conv.length}</span><span class="sub">${money(conv.reduce((s,b)=>s+calc(b).total,0))}</span></div><div class="stat"><span class="lbl">Conversão</span><span class="val">${db.budgets.length?Math.round(conv.length/db.budgets.length*100):0}%</span><span class="sub">orçamentos aprovados</span></div></div>
  <div class="row wrap" style="margin-bottom:14px;gap:10px"><div class="searchbar">${ic('search')}<input class="in" placeholder="Buscar paciente..." data-inp="bq" value="${esc(S.bq)}"></div><div class="seg">${[['todos','Todos'],['aberto','Em aberto'],['aprovado','Aprovados'],['recusado','Recusados']].map(([k,l])=>`<button class="${S.bf===k?'on':''}" data-act="bf" data-id="${k}">${l}</button>`).join('')}</div></div>
  <div class="glass card tlist">${L.length?`<div class="list">${L.map(b=>{const p=P(b.patientId),c=calc(b);const exp=b.validUntil&&b.validUntil<today()&&b.status==='aberto';return`<div class="item click" data-act="editBudget" data-id="${b.id}">${av(p?.name)}<div class="grow"><div class="t">${esc(p?.name||'—')}</div><div class="s">${fmtD(b.date)} · ${esc(procNames(b.items)||'sem itens')}</div></div><div style="text-align:right"><div class="price">${c.disc?`<span class="strike">${money(c.sub)}</span> `:''}${money(c.total)}</div>${exp?'<span class="badge">Vencido</span>':badge(BST,b.status)}</div>${p?.phone?`<button class="btn sm icon" data-act="sendBudget" data-id="${b.id}" title="Enviar no WhatsApp">${ic('wa')}</button>`:''}<button class="btn sm icon ghost" data-act="budgetMenu" data-id="${b.id}">${ic('more')}</button></div>`}).join('')}</div>`:empty('doc','Nenhum orçamento','Crie orçamentos para saber valores antes de agendar.',`<button class="btn dark" data-act="newBudget">${ic('plus')}Criar orçamento</button>`)}</div>`;
}
INP.bq=el=>{S.bq=el.value;const pos=el.selectionStart;render();const n=$('[data-inp="bq"]');n.focus();n.setSelectionRange(pos,pos)};
Object.assign(ACT,{bf:k=>{S.bf=k;render()},editBudget:id=>openBudget({id}),sendBudget:id=>sendBudget(id),
  budgetMenu:(id,a)=>{const b=db.budgets.find(x=>x.id===id);openMenu(a,[{label:'Converter em consulta',icon:'cal',fn:()=>budgetToAppt(b)},{label:'Enviar no WhatsApp',icon:'wa',fn:()=>sendBudget(id)},{label:'Imprimir / PDF',icon:'print',fn:()=>printBudget(b)},{label:'Abrir pasta do paciente',icon:'folder',fn:()=>openFolder(b.patientId,'orc')},{label:'Marcar como recusado',icon:'x',fn:()=>{b.status='recusado';changed()}},{label:'Excluir',icon:'trash',danger:true,fn:async()=>{if(await confirmBox('Excluir este orçamento?')){db.budgets=db.budgets.filter(x=>x!==b);changed()}}}])}});
function budgetText(b){const p=P(b.patientId),c=calc(b),s=db.settings;
  return`${fill(s.budgetIntro,{nome:first(p.name)})}\n\n${b.items.map(i=>`• ${i.name}${(+i.qty||1)>1?` (×${i.qty})`:''} — ${money(i.price*(i.qty||1))}`).join('\n')}\n\n${c.disc?`Subtotal: ${money(c.sub)}\nDesconto: − ${money(c.disc)}\n`:''}*Total: ${money(c.total)}*${b.validUntil?`\n\nVálido até ${fmtD(b.validUntil)}.`:''}${b.notes?`\n\n${b.notes}`:''}${s.clinic||s.doctor?`\n\n${[s.doctor,s.clinic].filter(Boolean).join(' · ')}`:''}`}
async function sendBudget(id){const b=db.budgets.find(x=>x.id===id),p=P(b.patientId);if(!p.phone){toast('Paciente sem WhatsApp cadastrado');return}if(evoOn()){toast('Enviando orçamento…');try{await evoSend(p.phone,budgetText(b));toast(`Orçamento enviado para ${first(p.name)}`)}catch(e){toast('Falha no envio: '+e.message);return}}else window.open(waLink(p.phone,budgetText(b)),'_blank');b.sentAt=today();save()}
function budgetToAppt(b){openAppt({patientId:b.patientId,items:clone(b.items),discountType:b.discountType,discountValue:b.discountValue,budgetId:b.id,date:today(),notes:b.notes})}
function printBudget(b){const p=P(b.patientId),c=calc(b),s=db.settings,w=window.open('','_blank');if(!w){toast('Permita pop-ups para imprimir');return}
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Orçamento - ${esc(p.name)}</title><style>body{font-family:Inter,Arial,sans-serif;color:#1d2127;max-width:720px;margin:40px auto;padding:0 24px}h1{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:0}.m{color:#7a828c;font-size:13px}table{width:100%;border-collapse:collapse;margin:28px 0}td,th{padding:11px 4px;border-bottom:1px solid #e6e8ec;text-align:left;font-size:14px}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7a828c}.r{text-align:right}.t td{border:0;padding:5px 4px}.big{font-size:20px;font-weight:700}hr{border:0;border-top:1px solid #e6e8ec;margin:24px 0}</style></head><body>
  <h1>${esc(s.clinic||'Orçamento')}</h1><div class="m">${esc(s.doctor||'')}</div><hr><div><b>Paciente:</b> ${esc(p.name)}</div><div class="m">Emitido em ${fmtD(b.date)}${b.validUntil?` · válido até ${fmtD(b.validUntil)}`:''}</div>
  <table><tr><th>Procedimento</th><th class="r">Qtd</th><th class="r">Valor</th></tr>${b.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty||1}</td><td class="r">${money(i.price*(i.qty||1))}</td></tr>`).join('')}
  <tr class="t"><td></td><td class="r m">Subtotal</td><td class="r">${money(c.sub)}</td></tr>${c.disc?`<tr class="t"><td></td><td class="r m">Desconto</td><td class="r">− ${money(c.disc)}</td></tr>`:''}<tr class="t"><td></td><td class="r"><b>Total</b></td><td class="r big">${money(c.total)}</td></tr></table>
  ${b.notes?`<p class="m">${esc(b.notes)}</p>`:''}</body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print()},350)}
function openBudget(o={}){
  const ex=o.id?db.budgets.find(b=>b.id===o.id):null;
  const st={patientId:ex?.patientId||o.patientId||'',date:ex?.date||today(),validUntil:ex?.validUntil||addDays(today(),15),items:clone(ex?.items||[]),discountType:ex?.discountType||'pct',discountValue:ex?.discountValue||0,notes:ex?.notes||'',status:ex?.status||'aberto'};
  openModal({title:ex?'Editar orçamento':'Novo orçamento',size:'lg',
    body:`<div class="stack"><div class="field"><span>Paciente <em>*</em></span><div data-pp></div></div>
      <div class="grid3"><div class="field"><span>Data</span><button type="button" class="in dateBtn" data-d="date"></button></div><div class="field"><span>Válido até</span><button type="button" class="in dateBtn" data-d="validUntil"></button></div>
      <div class="field"><span>Status</span><div class="seg" data-st style="display:flex">${Object.entries(BST).map(([k,[l]])=>`<button type="button" data-v="${k}" style="flex:1">${l}</button>`).join('')}</div></div></div>
      <div class="box"><div class="lbl">Procedimentos e valores</div><div data-ie></div></div>
      <label class="field"><span>Observações (aparecem na mensagem)</span><textarea class="in" data-notes placeholder="Ex.: pagamento em até 3x sem juros no cartão.">${esc(st.notes)}</textarea></label></div>`,
    foot:`${ex?`<button class="btn ghost danger left" data-del>${ic('trash')}</button><button class="btn" data-conv>${ic('cal')}<span class="btn-label">Virar consulta</span></button>`:''}<button class="btn" data-wa>${ic('wa')}<span class="btn-label">Salvar e enviar</span></button><button class="btn dark" data-save>${ic('check')}Salvar</button>`,
    onMount:(el,m)=>{
      const picker=patientPicker($('[data-pp]',el),st);itemEditor($('[data-ie]',el),st);
      const dd=()=>$$('[data-d]',el).forEach(b=>b.innerHTML=`<span>${fmtD(st[b.dataset.d])}</span>${ic('cal')}`);dd();
      $$('[data-d]',el).forEach(b=>b.onclick=async()=>{const k=b.dataset.d;const v=await pickDate(b,st[k],k==='validUntil'?[['7 dias',addDays(st.date,7)],['15 dias',addDays(st.date,15)],['30 dias',addDays(st.date,30)]]:null);if(v){st[k]=v;dd()}});
      const ds=()=>$$('[data-st] button',el).forEach(b=>b.classList.toggle('on',b.dataset.v===st.status));ds();
      $('[data-st]',el).onclick=e=>{const b=e.target.closest('[data-v]');if(b){st.status=b.dataset.v;ds()}};
      const doSave=()=>{const pid=picker.ensure();if(!pid){toast('Informe o paciente');return null}st.items=st.items.filter(i=>i.name.trim()||+i.price);if(!st.items.length){toast('Adicione ao menos um procedimento');return null}
        const rec={...(ex||{}),id:ex?.id||uid(),patientId:pid,date:st.date,validUntil:st.validUntil,items:st.items,discountType:st.discountType,discountValue:+st.discountValue||0,notes:$('[data-notes]',el).value.trim(),status:st.status,createdAt:ex?.createdAt||Date.now()};
        if(ex)Object.assign(ex,rec);else db.budgets.push(rec);m.close();changed();return rec};
      $('[data-save]',el).onclick=()=>{if(doSave())toast('Orçamento salvo')};
      $('[data-wa]',el).onclick=()=>{const r=doSave();if(r)sendBudget(r.id)};
      if(ex){$('[data-conv]',el).onclick=()=>{const r=doSave();if(r)budgetToAppt(r)};$('[data-del]',el).onclick=async()=>{if(await confirmBox('Excluir este orçamento?')){db.budgets=db.budgets.filter(x=>x!==ex);m.close();changed()}}}
    }});
}

/* ================= RETORNOS ================= */
function retList(){return S.retMode==='late'?lateReturns():returnsOfMonth(S.retMonth)}
function ensureSel(L){const k=S.retMode+'|'+S.retMonth;if(S.retSelKey!==k||!S.retSel){S.retSelKey=k;S.retSel=new Set(L.filter(r=>P(r.patientId).phone).map(r=>r.id))}}
function retVars(r){const p=P(r.patientId),s=db.settings;return{nome:first(p.name),nome_completo:p.name,data:fmtD(r.date),mes:mName(mKey(r.date)),procedimento:r.note||'seu procedimento',clinica:s.clinic||'nossa clínica',doutora:s.doctor||''}}
function vRetornos(){
  const L=retList();ensureSel(L);const t=mKey(today()),n=mShift(t,1),late=lateReturns().length;
  const withPhone=L.filter(r=>P(r.patientId).phone),sel=L.filter(r=>S.retSel.has(r.id)).length;
  const sample=L[0]||{patientId:null};
  const prev=L[0]?fill(db.settings.template,retVars(L[0])):fill(db.settings.template,{nome:'Maria',data:fmtD(addMonths(today(),1)),procedimento:'limpeza de pele',clinica:db.settings.clinic||'nossa clínica',doutora:db.settings.doctor||'',mes:mName(n)});
  return topbar('<em>Retornos</em>','Lembre suas pacientes na hora certa — sempre um mês à frente',`<button class="btn" data-act="newReturn">${ic('plus')}<span class="btn-label">Retorno manual</span></button>`)+
  `<div class="row wrap between" style="margin-bottom:14px;gap:10px">
    <div class="chips"><button class="chip ${S.retMode==='late'?'on':''}" data-act="rmode" data-id="late">Atrasados${late?` · ${late}`:''}</button><button class="chip ${S.retMode==='month'&&S.retMonth===t?'on':''}" data-act="rmonth" data-id="${t}">Este mês</button><button class="chip ${S.retMode==='month'&&S.retMonth===n?'on':''}" data-act="rmonth" data-id="${n}">Próximo mês</button></div>

function openQueueAuto(L){
  let running=false,stop=false;const st=L.map(()=>'wait');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  openModal({title:'Disparo automático',size:'sm',body:'<div data-q></div>',onMount:(el,m)=>{
    const draw=()=>{const ok=st.filter(x=>x==='ok').length,er=st.filter(x=>x==='err').length,done=ok+er;
      $('[data-q]',el).innerHTML=`<div class="row between small muted"><span>${running?'Enviando…':done?'Finalizado':'Pronto para enviar'}</span><span>${ok} enviada${ok===1?'':'s'}${er?` · ${er} com erro`:''}</span></div><div class="progress"><i style="width:${done/L.length*100}%"></i></div>
      <div class="list scroll" style="max-height:300px">${L.map((r,i)=>{const p=P(r.patientId);const b={wait:'<span class="badge">Na fila</span>',send:'<span class="badge info">Enviando…</span>',ok:'<span class="badge ok">Enviada ✓</span>',err:`<span class="badge bad" title="${esc(r._err||'')}">Erro</span>`}[st[i]];return`<div class="item">${av(p.name)}<div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(st[i]==='err'?r._err||'':p.phone)}</div></div>${b}</div>`}).join('')}</div>
      <div class="small muted" style="margin:12px 0 0">Intervalo de ~${+EVOLUTION.intervalo||8}s entre mensagens para proteger seu número.</div>
      <div class="row" style="margin-top:14px">${running?`<button class="btn" data-stop style="flex:1">Parar</button>`:done===L.length?`<button class="btn dark" data-end style="flex:1">Concluir</button>`:`<button class="btn" data-end style="flex:1">Cancelar</button><button class="btn dark" data-go style="flex:2">${ic('send')}Enviar ${L.length-done} mensage${L.length-done===1?'m':'ns'}</button>`}</div>`;
      const g=$('[data-go]',el),e=$('[data-end]',el),s2=$('[data-stop]',el);if(g)g.onclick=run;if(e)e.onclick=m.close;if(s2)s2.onclick=()=>{stop=true;s2.disabled=true;s2.textContent='Parando…'}};
    const run=async()=>{running=true;stop=false;draw();
      for(let i=0;i<L.length;i++){if(stop)break;if(st[i]==='ok')continue;const r=L[i],p=P(r.patientId);st[i]='send';draw();
        try{await evoSend(p.phone,fill(db.settings.template,retVars(r)));st[i]='ok';r.status='avisado';r.notifiedAt=today();save()}catch(e){st[i]='err';r._err=e.message}
        draw();if(i<L.length-1&&!stop){const d=(+EVOLUTION.intervalo||8)*1000;await wait(d*0.75+Math.random()*d*0.5)}}
      running=false;draw()};
    m.refresh=null;draw();
  },onClose:()=>{L.forEach(r=>delete r._err);S.retSel=null;changed()}});
}
/* ---------- Evolution API (WhatsApp automático) ---------- */
const evoOn=()=>!!(EVOLUTION.url&&EVOLUTION.instancia&&EVOLUTION.token);
async function evoFetch(path,opt={}){
  let base=String(EVOLUTION.url).trim().replace(/\/+$/,'');if(!/^https?:\/\//.test(base))base='https://'+base;
  let r;try{r=await fetch(base+path,{...opt,headers:{'Content-Type':'application/json',apikey:String(EVOLUTION.token).trim()}})}catch(e){throw new Error('sem conexão com a Evolution (verifique a URL)')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const m=j&&(j.response&&j.response.message||j.message||j.error);if(r.status===401)throw new Error('API Key inválida');if(r.status===404)throw new Error('instância não encontrada');throw new Error((Array.isArray(m)?m.join(' '):typeof m==='string'?m:'')||'erro '+r.status)}
  return j;
}
const evoInst=()=>encodeURIComponent(String(EVOLUTION.instancia).trim());
async function evoSend(phone,text){const number=waNum(phone);if(!number)throw new Error('telefone inválido');
  try{return await evoFetch(`/message/sendText/${evoInst()}`,{method:'POST',body:JSON.stringify({number,text})})}
  catch(e){if(/textMessage|erro 400|Bad Request/i.test(e.message))return await evoFetch(`/message/sendText/${evoInst()}`,{method:'POST',body:JSON.stringify({number,options:{delay:1200,presence:'composing'},textMessage:{text}})});throw e}}

INP.set=el=>{const k=el.dataset.k;let v=el.value;if(k==='doctorPhone')v=el.value=maskPhone(v);if(k==='summaryDay')v=Math.min(28,Math.max(1,+v||1));db.settings[k]=v;save();renderShell();toast('Salvo')};

INP.importData=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.patients)throw 0;if(await confirmBox(`Substituir os dados atuais pelo backup (${d.patients.length} pacientes)?`,'Importar')){const def=defaults();db={...def,...d,settings:{...def.settings,...d.settings}};changed();toast('Backup importado')}}catch(e){toast('Arquivo inválido')}};r.readAsText(f);el.value=''};
Object.assign(ACT,{
  exportData:()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`lumiere-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  reset:async()=>{if(await confirmBox('Apagar <b>todos</b> os dados? Recomendo exportar um backup antes.','Apagar tudo')){db=defaults();changed();toast('Dados apagados')}}
});

    const rm=back[i]>=4?6:3;db.returns.push({id:uid(),patientId:p.id,date:addMonths(d,rm),note:procNames(it),status:'pendente',apptId:a.id,createdAt:Date.now()});
    if(i%3===1){const pi=pr[(i+2)%pr.length];db.appointments.push({id:uid(),patientId:p.id,date:addDays(t,i),time:`${pad(10+i%6)}:00`,status:'agendada',items:[{procId:pi.id,name:pi.name,price:pi.price,qty:1}],discountType:'pct',discountValue:0,notes:'',createdAt:Date.now()})}
  });
  const ps=db.patients.slice(-10);
  db.budgets.push({id:uid(),patientId:ps[2].id,date:addDays(t,-3),validUntil:addDays(t,12),items:[{procId:pr[5].id,name:pr[5].name,price:pr[5].price,qty:2},{procId:pr[6].id,name:pr[6].name,price:pr[6].price,qty:1}],discountType:'pct',discountValue:10,notes:'Pagamento em até 3x sem juros.',status:'aberto',createdAt:Date.now()});
  db.budgets.push({id:uid(),patientId:ps[7].id,date:addDays(t,-12),validUntil:addDays(t,3),items:[{procId:pr[3].id,name:pr[3].name,price:pr[3].price,qty:1}],discountType:'val',discountValue:100,notes:'',status:'aprovado',createdAt:Date.now()});
  if(!db.settings.doctor)db.settings.doctor='Dra. Helena';if(!db.settings.clinic)db.settings.clinic='Helena Estética da Pele';
  S.retSel=null;
}
